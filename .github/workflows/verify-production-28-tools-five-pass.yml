name: Verify Production Bridge 28 Tools Five Pass

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/server.js'
      - 'openapi.yaml'
      - 'scripts/verify-production-bridge.js'
      - '.github/workflows/verify-production-28-tools-five-pass.yml'

permissions:
  contents: read
  id-token: write

jobs:
  verify-five-pass:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Install verification dependencies
        run: npm ci
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: 31b68e12-4f97-4bb6-81cd-dbd57fde5f05
          tenant-id: aa0b99c9-b756-4611-970a-6c31013c42e3
          subscription-id: bca73b1e-b6b5-4f80-9332-ca299cc033a5
      - name: Verify production five consecutive passes
        env:
          VERIFICATION_MODE: smoke
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            echo "::notice title=Production verification::pass $i/5"
            node scripts/verify-production-bridge.js
            if [ "$i" -lt 5 ]; then sleep 5; fi
          done
