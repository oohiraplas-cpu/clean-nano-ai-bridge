name: Bridge 名簿（xlsx）の社員台帳への取り込み（既定は確認のみ）
# Imports a roster into CN_社員台帳 without creating duplicates (see src/importRoster.js).
# The rows are PERSONAL DATA and this repository is PUBLIC: the rows come ONLY from the GitHub secret ROSTER_JSON
# (never from a workflow input, never from a file in the repository). The run log shows row numbers, counts and reasons only.
#   create        : no ledger row has this e-mail or name        -> one new row (社員ID=未採番, 在職, 未着手)
#   fill          : exactly one ledger row has this name         -> only its EMPTY columns are filled
#   skip_existing : nothing left to fill                          -> nothing (re-running is safe)
#   hold/conflict : out-of-scope category, duplicates, bad input  -> nothing, reported for a human
# Default (dryRun=true) is READ-ONLY. dryRun=false needs the approval phrase IMPORT-ROSTER. No existing value is overwritten.
# The MCP key is read from Azure App Service settings inside the run, masked, sent as a header, never printed.
on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: "true=確認のみ（既定）。false=実際に書き込む"
        required: true
        default: "true"
      categories:
        description: "取り込む区分（カンマ区切り）。既定は 一般社員,アルバイト（協力会社は含めない）"
        required: true
        default: "一般社員,アルバイト"
      approval:
        description: "dryRun=false のときだけ、人間の承認文言 IMPORT-ROSTER をそのまま入力"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

env:
  APP_NAME: clean-nano-ai-bridge
  BASE_URL: https://clean-nano-ai-bridge-c7evcxhtergad9b0.westus3-01.azurewebsites.net/mcp

jobs:
  import:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Refuse early when a real run is requested without the approval phrase
        if: ${{ inputs.dryRun == 'false' && inputs.approval != 'IMPORT-ROSTER' }}
        run: |
          echo "::error::dryRun=false needs the approval phrase IMPORT-ROSTER. Nothing was changed."
          exit 1

      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: 31b68e12-4f97-4bb6-81cd-dbd57fde5f05
          tenant-id: aa0b99c9-b756-4611-970a-6c31013c42e3
          subscription-id: bca73b1e-b6b5-4f80-9332-ca299cc033a5

      - name: Import (plan first; writes only with dryRun=false; rows and key are never printed)
        env:
          ROSTER_JSON: ${{ secrets.ROSTER_JSON }}
          DRY_RUN: ${{ inputs.dryRun }}
          CATEGORIES: ${{ inputs.categories }}
        run: |
          set -euo pipefail
          test -n "$ROSTER_JSON" || { echo "::error::The secret ROSTER_JSON is not set. Nothing was changed."; exit 1; }
          RG=$(az webapp list --query "[?name=='$APP_NAME'].resourceGroup | [0]" -o tsv --only-show-errors)
          test -n "$RG" || { echo "::error::App Service $APP_NAME not found"; exit 1; }
          KEY=$(az webapp config appsettings list --name "$APP_NAME" --resource-group "$RG" --query "[?name=='MCP_API_KEY'] | [0].value" -o tsv --only-show-errors)
          test -n "$KEY" || { echo "::error::MCP_API_KEY is not set"; exit 1; }
          echo "::add-mask::$KEY"
          export KEY
          node scripts/import-roster.js
