name: CN_AI依頼台帳 安全バックアップ取得（手動・読取専用）
# This workflow is intentionally separate from the legacy CN_CompanyOS sync.
# Never import, publish, commit, or overwrite any application source here.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  export-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1
        with:
          pac-version-override: 2.4.1

      - name: Export CN_AI依頼台帳 unmanaged solution
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: https://org0bbb24c5.crm7.dynamics.com
          app-id: 9cb3b23b-aa1a-4a45-a73e-24c78a2c2252
          client-secret: ${{ secrets.POWER_PLATFORM_CLIENT_SECRET }}
          tenant-id: aa0b99c9-b756-4611-970a-6c31013c42e3
          solution-name: CN_AIIraiDaicho
          solution-output-file: out/CN_AIIraiDaicho-unmanaged.zip

      - name: Verify exported file exists
        run: test -s out/CN_AIIraiDaicho-unmanaged.zip

      - name: Record backup checksum
        run: sha256sum out/CN_AIIraiDaicho-unmanaged.zip > out/CN_AIIraiDaicho-unmanaged.sha256

      - name: Upload backup artifact (no repository changes)
        uses: actions/upload-artifact@v4
        with:
          name: CN_AIIraiDaicho-unmanaged-backup
          path: |
            out/CN_AIIraiDaicho-unmanaged.zip
            out/CN_AIIraiDaicho-unmanaged.sha256
          retention-days: 30

      - name: Extract isolated Canvas App YAML for review only
        shell: bash
        run: |
          python3 - <<'PY'
          import io, json, pathlib, zipfile
          src = pathlib.Path('out/CN_AIIraiDaicho-unmanaged.zip')
          dst = pathlib.Path('out/CN_AIiraidaicho_source/Source')
          dst.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(src) as solution:
              if solution.testzip(): raise SystemExit('Invalid solution archive')
              required = {'solution.xml', 'customizations.xml', '[Content_Types].xml'}
              missing = required.difference(solution.namelist())
              if missing: raise SystemExit(f'Invalid Power Platform solution: missing root files {sorted(missing)}')
              meta = solution.read('solution.xml').decode('utf-8-sig')
              if '<UniqueName>CN_AIIraiDaicho</UniqueName>' not in meta:
                  raise SystemExit('Unexpected solution unique name')
              apps = [n for n in solution.namelist() if n.startswith('CanvasApps/') and n.endswith('.msapp')]
              if len(apps) != 1: raise SystemExit(f'Expected exactly one canvas app; got {len(apps)}')
              with zipfile.ZipFile(io.BytesIO(solution.read(apps[0]))) as app:
                  if app.testzip(): raise SystemExit('Invalid Canvas App archive')
                  props = json.loads(app.read('Properties.json'))
                  if props.get('Name') != 'clean nano kk':
                      raise SystemExit('Unexpected Canvas App display name: ' + repr(props.get('Name')))
                  names = [n for n in app.namelist() if n.replace('\\', '/').startswith('Src/') and n.endswith('.pa.yaml')]
                  if not names: raise SystemExit('No Canvas App YAML source found')
                  archive_entries = {}
                  for name in names:
                      parts = name.replace('\\', '/').split('/')
                      if any(part in ('', '.', '..') for part in parts):
                          raise SystemExit('Unsafe source archive entry')
                      basename = parts[-1]
                      if basename in archive_entries or app.namelist().count(name) != 1:
                          raise SystemExit('Ambiguous source archive entry')
                      info = app.getinfo(name)
                      if info.file_size > 2 * 1024 * 1024:
                          raise SystemExit('Source size limit')
                      archive_entries[basename] = name
                      (dst / basename).write_bytes(app.read(name))
                  (dst.parent / 'source-manifest.json').write_text(json.dumps({
                      'solution': 'CN_AIIraiDaicho',
                      'appDisplayName': props['Name'],
                      'files': sorted(p.name for p in dst.iterdir()),
                      'observedArchiveEntries': archive_entries,
                      'appIdParityVerified': False,
                      'savedSourceComparisonVerified': False,
                      'note': 'Review-only artifact; not a Studio draft or proof of app ID parity'
                  }, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Upload isolated source artifact (no repository changes)
        uses: actions/upload-artifact@v4
        with:
          name: CN_AIiraidaicho-extracted-source-review
          path: out/CN_AIiraidaicho_source/
          retention-days: 30

      - name: Print live screen names only (read-only; no control or formula content)
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re
          d = pathlib.Path('out/CN_AIiraidaicho_source/Source')
          screens = []
          for p in sorted(d.glob('*.pa.yaml')):
              if p.name in ('App.pa.yaml', '_EditorState.pa.yaml'):
                  continue
              lines = p.read_text(encoding='utf-8-sig').splitlines()
              name = None
              for i, line in enumerate(lines):
                  if line.startswith('Screens:'):
                      for nxt in lines[i + 1:]:
                          m = re.match(r'^  ([^\s:]+):', nxt)
                          if m:
                              name = m.group(1)
                              break
                      break
              screens.append((p.name, name, len(lines)))
          print('live screen count =', len(screens))
          for f, n, c in screens:
              print(f'{f}\t{n}\t{c} lines')
          es = d / '_EditorState.pa.yaml'
          if es.exists():
              print('--- _EditorState ScreensOrder ---')
              on = False
              for line in es.read_text(encoding='utf-8-sig').splitlines():
                  if 'ScreensOrder' in line:
                      on = True
                      continue
                  if on:
                      if line.strip().startswith('- '):
                          print(line.strip()[2:])
                      else:
                          break
          PY

      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Compare control names only (live vs Git canonical; no formulas printed)
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re
          live = pathlib.Path('out/CN_AIiraidaicho_source/Source')
          git = pathlib.Path('repo/powerapps/CN_AI依頼台帳/Source')
          pat = re.compile(r'^\s*- ([A-Za-z0-9_]+):\s*\n\s+Control: ([A-Za-z0-9_.]+)', re.M)
          def ctrls(p):
              return {(m.group(1), m.group(2)) for m in pat.finditer(p.read_text(encoding='utf-8-sig'))}
          skip = {'App.pa.yaml', '_EditorState.pa.yaml'}
          names = sorted({p.name for p in live.glob('*.pa.yaml')} | {p.name for p in git.glob('*.pa.yaml')} - skip)
          for n in names:
              if n in skip: continue
              l = ctrls(live / n) if (live / n).exists() else None
              g = ctrls(git / n) if (git / n).exists() else None
              if l is None: print(f'{n}: only in Git ({len(g)} controls)'); continue
              if g is None: print(f'{n}: only in LIVE ({len(l)} controls)'); continue
              ol, og = sorted(l - g), sorted(g - l)
              print(f'{n}: live={len(l)} git={len(g)} onlyLive={len(ol)} onlyGit={len(og)}')
              for c in ol[:15]: print('   +live', c[0], c[1])
              for c in og[:15]: print('   +git ', c[0], c[1])
          PY
