# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - clean-nano-ai-bridge

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7CE0F63C92A94343949217403D8BFDDA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1E821E73D9CE47A08E5EC8626CAE0AE8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6D74E66B3A434F8094BFC1E6208A2B38 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'clean-nano-ai-bridge'
          slot-name: 'Production'
          package: .

      - name: Configure Bridge State Manager Enforcement and Deployment SHA
        run: |
          RG="$(az webapp list --query "[?name=='clean-nano-ai-bridge'].resourceGroup | [0]" -o tsv)"
          az webapp config appsettings set \
            --name clean-nano-ai-bridge \
            --resource-group "$RG" \
            --settings BRIDGE_STATE_MANAGER_ENFORCE=true DEPLOYMENT_SHA=${{ github.sha }}

      - name: Restart Azure Web App to load deployed code
        run: |
          RG="$(az webapp list --query "[?name=='clean-nano-ai-bridge'].resourceGroup | [0]" -o tsv)"
          az webapp restart --name clean-nano-ai-bridge --resource-group "$RG"

      - name: Verify restarted app health
        run: |
          RG="$(az webapp list --query "[?name=='clean-nano-ai-bridge'].resourceGroup | [0]" -o tsv)"
          HOST="$(az webapp show --name clean-nano-ai-bridge --resource-group "$RG" --query defaultHostName -o tsv)"
          for i in {1..12}; do
            if curl --fail --silent --show-error "https://$HOST/health"; then exit 0; fi
            sleep 5
          done
          exit 1
