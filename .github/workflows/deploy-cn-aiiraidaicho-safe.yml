name: Deploy CN_AI依頼台帳 Bridge safely

on:
  push:
    branches:
      - fix/cn-aiiraidaicho-safe-export-20260926

permissions:
  contents: read
  id-token: write

concurrency:
  group: clean-nano-ai-bridge-cn-aiiraidaicho
  cancel-in-progress: false

env:
  NODE_VERSION: '20.x'
  AZURE_WEBAPP_NAME: clean-nano-ai-bridge

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --omit=dev
      - uses: azure/login@v2
        with:
          client-id: 31b68e12-4f97-4bb6-81cd-dbd57fde5f05
          tenant-id: aa0b99c9-b756-4611-970a-6c31013c42e3
          subscription-id: bca73b1e-b6b5-4f80-9332-ca299cc033a5
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: .
