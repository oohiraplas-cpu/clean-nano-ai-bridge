name: Deploy clean-nano-ai-bridge to Azure Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: clean-nano-ai-bridge
  NODE_VERSION: '20.x'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Skip deploy when publish profile is not configured
        if: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE == '' }}
        run: |
          echo "AZURE_WEBAPP_PUBLISH_PROFILE is not configured. Deployment skipped safely."

      - name: Deploy to Azure Web App
        if: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
