name: Power Apps ソース同期 (CN_CompanyOS)

on:
  workflow_dispatch:
    inputs:
      direction:
        description: "pull: 環境の最新をGitHubへ取得 / push: GitHubの内容を環境へ反映して公開"
        required: true
        type: choice
        options:
          - pull
          - push
  push:
    branches:
      - main
    paths:
      - "powerapps/CN_CompanyOS_ElectronicDailyReport/Source/**"
      - ".github/workflows/powerapps-solution-sync.yml"

env:
  ENVIRONMENT_URL: https://org0bbb24c5.crm7.dynamics.com
  SOLUTION_NAME: CN_CompanyOS
  SOURCE_PATH: powerapps/CN_CompanyOS_ElectronicDailyReport

jobs:
  pull:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.direction == 'pull' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1
        with:
          pac-version-override: 2.4.1

      - name: Export Solution
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ env.ENVIRONMENT_URL }}
          app-id: 31b68e12-4f97-4bb6-81cd-dbd57fde5f05
          tenant-id: aa0b99c9-b756-4611-970a-6c31013c42e3
          solution-name: ${{ env.SOLUTION_NAME }}
          solution-output-file: out/${{ env.SOLUTION_NAME }}.zip

      - name: Unpack Solution
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file: out/${{ env.SOLUTION_NAME }}.zip
          solution-folder: out/solution
          solution-type: Unmanaged
          overwrite-files: true

      - name: Unpack canvas app into editable source
        run: |
          set -e
          MSAPP=$(find "out/solution" -iname "*.msapp" | head -n 1)
          test -n "$MSAPP"
          rm -rf "${{ env.SOURCE_PATH }}/Source"
          pac canvas unpack --msapp "$MSAPP" --sources "${{ env.SOURCE_PATH }}/Source" --layout SourceCode --overwrite

      - name: Commit updated source to repo
        run: |
          git config user.name "clean-nano-ai-bridge bot"
          git config user.email "actions@users.noreply.github.com"
          git add "${{ env.SOURCE_PATH }}/Source"
          git diff --cached --quiet || git commit -m "chore(powerapps): pull latest source from environment"
          git push

  push:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.direction == 'push') }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1
        with:
          pac-version-override: 2.4.1

      - name: Export current solution
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ env.ENVIRONMENT_URL }}
          app-id: 31b68e12-4f97-4bb6-81cd-dbd57fde5f05
          tenant-id: aa0b99c9-b756-4611-970a-6c31013c42e3
          solution-name: ${{ env.SOLUTION_NAME }}
          solution-output-file: out/base.zip

      - name: Unpack current solution
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file: out/base.zip
          solution-folder: out/solution
          solution-type: Unmanaged
          overwrite-files: true

      - name: Pack canvas app from edited source
        run: |
          set -e
          MSAPP=$(find "out/solution" -iname "*.msapp" | head -n 1)
          test -n "$MSAPP"
          pac canvas pack --sources "${{ env.SOURCE_PATH }}/Source" --msapp "$MSAPP" --layout SourceCode --overwrite

      - name: Pack Solution
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: out/solution
          solution-file: out/${{ env.SOLUTION_NAME }}.zip
          solution-type: Unmanaged

      - name: Import Solution
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ env.ENVIRONMENT_URL }}
          app-id: 31b68e12-4f97-4bb6-81cd-dbd57fde5f05
          tenant-id: aa0b99c9-b756-4611-970a-6c31013c42e3
          solution-file: out/${{ env.SOLUTION_NAME }}.zip

      - name: Publish customizations
        uses: microsoft/powerplatform-actions/publish-solution@v1
        with:
          environment-url: ${{ env.ENVIRONMENT_URL }}
          app-id: 31b68e12-4f97-4bb6-81cd-dbd57fde5f05
          tenant-id: aa0b99c9-b756-4611-970a-6c31013c42e3
