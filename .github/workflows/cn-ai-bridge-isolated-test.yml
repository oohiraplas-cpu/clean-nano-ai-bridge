name: CN_AI Bridge isolated test only
on:
  push:
    branches:
      - sync/cn-aiiraidaicho-bridge-target-20260926
      - fix/cn-ai-save-preflight-20260926
      - fix/cn-ai-save-verification-guard-20260926
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
      - run: npm ci
      - run: npm test
