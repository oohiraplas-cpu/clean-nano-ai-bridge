openapi: 3.0.3
info:
  title: Clean Nano AI Bridge API
  version: 1.0.0
  description: Power Platformと外部AIを接続するAPI。業務データの正本はSharePoint Listsです。
# 公開ホストは未確定のため、serversは意図的に未指定です。
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: 接続確認
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /api/tasks:
    get:
      operationId: listTasks
      responses:
        '200':
          description: タスク一覧
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskListResponse' }
  /api/next:
    get:
      operationId: getNextTask
      responses:
        '200':
          description: 次タスクまたはタスクなし
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NextResponse' }
  /webhooks/claude-code:
    post:
      operationId: receiveClaudeCodeWebhook
      security: [{ WebhookApiKey: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TaskInput' } } } }
      responses:
        '202': { description: 受付済み }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /webhooks/copilot:
    post:
      operationId: receiveCopilotWebhook
      security: [{ WebhookApiKey: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TaskInput' } } } }
      responses:
        '202': { description: 受付済み }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/tasks/{id}/status:
    post:
      operationId: updateTaskStatus
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StatusInput' } } } }
      responses:
        '200': { description: 更新済み }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: タスクなし }
  /mcp:
    post:
      x-ms-agentic-protocol: mcp-streamable-1.0
      operationId: invokeMcpBridge
      description: |
        ChatGPT / Claude Code / CN_総合秘書AI が共通で使うMCP風エントリポイント。
        method は health_check・get_tasks・get_next_task・create_task・update_task_status・
        get_task_result、Power Apps取得・ソース編集・保存・公開メソッド、
        get_sharepoint_list、run_power_automate_flow のいずれかを指定します。
        health_check・get_tasks・get_next_task はそれぞれ GET /health・GET /api/tasks・
        GET /api/next と同じ結果を result に返します。
        create_task は params.title（必須）・params.description（任意）・params.priority（任意、
        既定値 normal）で新規タスクを登録し、result.task_id と result.task を返します。
        update_task_status は params.task_id（必須）・params.status（必須）・params.result（任意）
        でタスクの状態と結果を更新し、result.task を返します。
        get_task_result は params.task_id（必須）で現在の status・result を返します。
        task_idが存在しない場合は404を返します。
        get_sharepoint_list は params.listId または params.listName のいずれか（必須）・
        params.siteId（任意、省略時は既定サイト）・params.top（任意、既定50、最大200）で
        SharePointリストの項目を読み取り専用で取得します。
        run_power_automate_flow は params.flowKey（必須、あらかじめ環境変数で登録されたフローのキー）・
        params.payload（任意）・params.approvedByHuman（必須、true固定）で登録済みPower Automate
        フローを実行します。approvedByHumanがtrueでない場合はエラーになり、実行されません
        （更新・実行系の操作は人間の承認を必須とする方針のため）。

        Power Apps変更の検証・デプロイ・権限管理として、次の9メソッドも指定できます（paramsは
        inputSchemaのとおり厳密で、未定義のプロパティは400になります）。
        validate_powerapps_change（変更前検査: valid・errors・warnings・summary）、
        run_powerapps_tests（静的検査。実行不能な項目は成功扱いにせずskippedとreasonを返す）、
        verify_save_result（保存後に正本ソースとアプリ状態を再取得して検証）、
        deploy_to_test（構成済みの非本番テスト環境のみ。本番・環境不明・設定不足・branch不一致は拒否）、
        verify_deployment（環境・バージョン・デプロイ結果・healthを検証）、
        get_deployment_logs（診断ログ。秘密値はマスク）、
        rollback_deployment（確認済みの復旧元のみ。本番はapprovedByHuman:true必須）、
        get_permissions（読み取り専用）、
        update_permissions（approvedByHuman:true必須。強い権限・外部共有は拒否）。
        外部APIが未構成の場合は、ダミー成功にせず503で status:not_configured・reason・
        missingConfiguration を返します。

        update_powerapps_app・save_powerapps_app・publish_powerapps_app は任意のparams.branch
        （get_powerapps_sourceが返したbranch）を受け取り、正本branchと一致しない場合は409で拒否します。
        update_powerapps_appは、ソースが正本branch以外（過去branch等）でしか見つからない場合も409で拒否します。
      security: [{ McpApiKey: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/McpInput' } } } }
      responses:
        '200':
          description: 実行結果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 方針により拒否（本番デプロイ、未承認の本番ロールバック、強い権限・外部共有など） }
        '404': { description: 対象が見つからない（task_id、deploymentId、復旧元、取り消す権限など） }
        '409': { description: 競合・不一致（正本branch不一致、未確認の復旧元など） }
        '502': { description: 上流API（GitHub、Power Apps、Dataverse等）の異常。detailsに上流のHTTP statusを含む }
        '503': { description: 外部API・設定が未構成（status:not_configured、reason、missingConfigurationを返す） }
components:
  securitySchemes:
    WebhookApiKey: { type: apiKey, in: header, name: X-API-Key }
    McpApiKey: { type: apiKey, in: header, name: X-API-Key }
  responses:
    BadRequest: { description: 入力不正 }
    Unauthorized: { description: 認証失敗 }
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties: { status: { type: string, example: ok } }
    Task:
      type: object
      required: [id, title, status, retry_count]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [未着手, 実行中, 完了, 停止, エラー, 判断待ち, 人間承認待ち, ユーザー操作待ち, タスクなし] }
        retry_count: { type: integer, minimum: 0 }
        approval_required: { type: boolean }
        userActionRequired: { type: boolean }
        priority: { type: string, description: create_task経由で登録したタスクの優先度（既定値 normal） }
        result: { type: string, description: update_task_status経由で書き戻された実行結果 }
    TaskInput:
      allOf:
        - { $ref: '#/components/schemas/Task' }
        - { required: [id, title] }
    StatusInput:
      type: object
      properties:
        status: { type: string }
        retry_count: { type: integer, minimum: 0 }
        approval_required: { type: boolean }
        userActionRequired: { type: boolean }
    TaskListResponse:
      type: object
      required: [status, count, tasks]
      properties:
        status: { type: string }
        count: { type: integer }
        tasks: { type: array, items: { $ref: '#/components/schemas/Task' } }
    NextResponse:
      type: object
      required: [status, task]
      properties:
        status: { type: string }
        task:
          allOf: [{ $ref: '#/components/schemas/Task' }]
          nullable: true
    McpInput:
      type: object
      required: [method]
      properties:
        method:
          type: string
          enum: [health_check, get_tasks, get_next_task, create_task, update_task_status, get_task_result, get_powerapps_app, get_powerapps_state, get_powerapps_source, update_powerapps_app, save_powerapps_app, publish_powerapps_app, get_powerapps_operation_result, get_sharepoint_lists, create_sharepoint_list, get_sharepoint_list, get_sharepoint_columns, ensure_sharepoint_columns, run_power_automate_flow, create_employee_ledger_entry, update_employee_ledger_entry, validate_powerapps_change, run_powerapps_tests, verify_save_result, deploy_to_test, verify_deployment, get_deployment_logs, rollback_deployment, get_permissions, update_permissions]
          description: 3AI共通Bridgeが対応する標準メソッド
        params: { type: object }
    McpResponse:
      type: object
      required: [accepted, method, result]
      properties:
        accepted: { type: boolean }
        method: { type: string }
        result:
          type: object
          description: |
            health_checkはHealthResponse、get_tasksはTaskListResponse、get_next_taskはNextResponseと同じ形状。
            create_taskは { task_id, task }、update_task_statusは { task }、
            get_task_resultは { task_id, status, result } を返す。