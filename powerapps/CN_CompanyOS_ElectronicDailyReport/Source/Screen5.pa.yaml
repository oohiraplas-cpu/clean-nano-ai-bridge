Screens:
  Screen5:
    Properties:
      Height: =1123
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =UpdateContext({ctxReport: Gallery1.Selected})
      Width: =794
    Children:
      - PrintButton1:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(0, 134, 208, 1)
            Font: =Font.'Open Sans'
            Height: =32
            OnSelect: =Print()
            Size: =13
            TabIndex: =0
            Text: ="PDFを見る・印刷"
            Visible: =Not(Parent.Printing)
            Width: =96
            X: =Parent.Width - Self.Width - 25
            Y: =25
      - Label4:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Text: ="電子日報 PDF確認"
            X: =40
            Y: =40
      - Button12:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: =Navigate(Screen2, ScreenTransition.CoverRight)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="訂正する"
            X: =60
            Y: =60
      - Button13:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =Patch(CN_電子日報台帳, Gallery1.Selected, {提出状態: {Value: "提出済み"}}); Office365Outlook_1.V4CalendarPostItem(dropdownCalendarSelection1.Selected.Name, "日報提出：" & Gallery1.Selected.現場名, Text(Gallery1.Selected.作業日, "yyyy-mm-dd") & "T17:00:00", Text(Gallery1.Selected.作業日, "yyyy-mm-dd") & "T17:30:00", "Tokyo Standard Time"); Launch("https://line.me/R/share?text=" & EncodeUrl("電子日報を提出しました。日報ID：" & Gallery1.Selected.日報ID & " 現場：" & Gallery1.Selected.現場名))
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="提出・LINE共有"
            X: =80
            Y: =80
      - Label5:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Text: ="日報ID：" & ctxReport.日報ID & Char(10) & "作業日：" & Text(ctxReport.作業日, "yyyy/mm/dd") & Char(10) & "社員：" & ctxReport.社員名 & Char(10) & "現場：" & ctxReport.現場名 & Char(10) & "元請：" & ctxReport.元請会社 & Char(10) & "作業内容：" & ctxReport.作業内容 & Char(10) & "人工：" & Text(ctxReport.人工) & Char(10) & "元請担当者：" & ctxReport.元請担当者名
            X: =100
            Y: =100
