            AccessibleLabel: =Self.Tooltip
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Height: =88
            Icon: =Icon.Check
            DisplayMode: =If(gblIsSaving, DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: =If(!Connection.Connected, Notify("通信に接続してから保存してください。入力内容はこの画面に残っています。", NotificationType.Warning), If(!EditForm1.Valid, Notify("必須項目と入力内容を確認してください。", NotificationType.Warning), Set(gblIsSaving, true); Set(gblError, Blank()); SubmitForm(EditForm1)))
            PaddingBottom: =22
            PaddingLeft: =22
            PaddingRight: =22
            PaddingTop: =22
            PressedFill: =RGBA(255, 255, 255, 0.3)
            TabIndex: =0
            Tooltip: ="項目の送信"
            Width: =88
            X: =Parent.Width - Self.Width
