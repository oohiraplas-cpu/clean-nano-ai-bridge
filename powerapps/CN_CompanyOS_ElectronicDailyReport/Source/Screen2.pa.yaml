          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =88
            Size: =27
            Text: ="電子日報 登録"
            Width: =Parent.Width - IconCancel1.Width - IconAccept1.Width
            Wrap: =false
            X: =IconCancel1.X + IconCancel1.Width
