App:
  Properties:
    OnStart: |+
      =Set(varBridgeHealth, CN_AI_Bridge.HealthCheck());
      Set(varBridgeTasks, CN_AI_Bridge.GetTasks());
      Set(varBridgeNextTask, CN_AI_Bridge.GetNextTask());
      Set(varBridgeReady, true)









    Theme: =PowerAppsTheme
