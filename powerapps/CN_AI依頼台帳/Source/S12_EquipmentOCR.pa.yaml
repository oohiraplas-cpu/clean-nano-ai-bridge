Screens:
  S12_EquipmentOCR:
    Properties:
      Fill: =RGBA(10, 10, 10, 1)
    Children:
      - OCR_Title:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(0, 204, 102, 1)
            FontWeight: =FontWeight.Bold
            Height: =54
            Size: =22
            Text: ="設備書類自動記載"
            Width: =Parent.Width - 32
            X: =16
            Y: =16
      - OCR_Back:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(10, 10, 10, 1)
            Fill: =RGBA(255, 255, 255, 1)
            HoverColor: =RGBA(10, 10, 10, 1)
            HoverFill: =RGBA(245, 245, 245, 1)
            PressedColor: =RGBA(10, 10, 10, 1)
            PressedFill: =RGBA(224, 224, 224, 1)
            Height: =44
            OnSelect: =Navigate(S2_Calendar, ScreenTransition.None)
            Text: ="カレンダーへ戻る"
            Width: =Parent.Width - 32
            X: =16
            Y: =80
      - OCR_Status:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =120
            Size: =14
            Text: ="画像・PDF・帳票を読み取り、検満リストを検索して計画実施表へ自動記載します。番号分割・住所改行・照合停止ルールを維持し、不一致時は確定せず人間確認へ進みます。"
            Width: =Parent.Width - 32
            X: =16
            Y: =140
      - OCR_ReadPreview:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(10, 10, 10, 1)
            Fill: =RGBA(255, 255, 255, 1)
            HoverColor: =RGBA(10, 10, 10, 1)
            HoverFill: =RGBA(245, 245, 245, 1)
            PressedColor: =RGBA(10, 10, 10, 1)
            PressedFill: =RGBA(224, 224, 224, 1)
            Height: =44
            OnSelect: =Navigate(S18_OcrReadPreview, ScreenTransition.None)
            Text: ="読取プレビューを見る"
            Width: =Parent.Width - 32
            X: =16
            Y: =276
