Screens:
  S5_Salary:
    Properties:
      Fill: =RGBA(10, 10, 10, 1)
      OnVisible: |-
        =If(IsBlank(gblMonth), Set(gblMonth, Date(Year(Today()), Month(Today()), 1)));
        If(IsBlank(gblEmpID), Set(gblEmpID, First(CN_社員台帳).EmployeeID));
        ClearCollect(colAttend, Filter(CN_勤怠明細台帳, 社員レコードキー = gblEmpID, 開始日時 >= gblMonth, 開始日時 < DateAdd(gblMonth, 1, TimeUnit.Months)))
    Children:
      - S5_Title:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(0, 204, 102, 1)
            FontWeight: =FontWeight.Bold
            Height: =50
            Size: =20
            Text: =Text(gblMonth, "yyyy年m月")
            Width: =Parent.Width - 140
            X: =70
            Y: =16
      - S5_Prev:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(0, 204, 102, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =50
            HoverFill: =RGBA(0, 230, 115, 1)
            OnSelect: =Set(gblMonth, DateAdd(gblMonth, -1, TimeUnit.Months)); ClearCollect(colAttend, Filter(CN_勤怠明細台帳, 社員レコードキー = gblEmpID, 開始日時 >= gblMonth, 開始日時 < DateAdd(gblMonth, 1, TimeUnit.Months)))
            PressedFill: =RGBA(0, 160, 80, 1)
            Size: =18
            Text: ="＜"
            Width: =50
            X: =16
            Y: =16
      - S5_Next:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(0, 204, 102, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =50
            HoverFill: =RGBA(0, 230, 115, 1)
            OnSelect: =Set(gblMonth, DateAdd(gblMonth, 1, TimeUnit.Months)); ClearCollect(colAttend, Filter(CN_勤怠明細台帳, 社員レコードキー = gblEmpID, 開始日時 >= gblMonth, 開始日時 < DateAdd(gblMonth, 1, TimeUnit.Months)))
            PressedFill: =RGBA(0, 160, 80, 1)
            Size: =18
            Text: ="＞"
            Width: =50
            X: =Parent.Width - 66
            Y: =16
      - S5_Emp:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(120, 120, 120, 1)
            Height: =26
            Size: =12
            Text: ="作業員：" & Coalesce(LookUp(CN_社員台帳, EmployeeID = gblEmpID).Title, "未選択")
            Width: =Parent.Width - 32
            X: =16
            Y: =68
      - S5_NoMaster:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 51, 51, 1)
            Height: =60
            Text: ="CN_社員マスタにこの作業員（社員ID：" & gblEmpID & "）の登録がありません。金額は表示できません。"
            Visible: =IsBlank(LookUp(CN_社員マスタ, 社員ID = gblEmpID))
            Width: =Parent.Width - 32
            X: =16
            Y: =510
      - S5_Card:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(26, 58, 42, 1)
            Height: =330
            Visible: =!IsBlank(LookUp(CN_社員マスタ, 社員ID = gblEmpID))
            Width: =Parent.Width - 32
            X: =16
            Y: =100
      - S5_BaseCap:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =30
            Text: ="基本給"
            Width: =(Parent.Width - 64) / 2
            X: =32
            Y: =112
      - S5_BaseVal:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(255, 255, 255, 1)
            Height: =30
            Text: |-
              =With({m: LookUp(CN_社員マスタ, 社員ID = gblEmpID)}, Text(Coalesce(m.基本給, 0), "¥#,##0"))
            Width: =(Parent.Width - 64) / 2
            X: =16 + (Parent.Width - 32) / 2
            Y: =112
      - S5_DayCap:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =30
            Text: ="日勤手当 × " & CountRows(Filter(colAttend, 勤務区分.Value = "日勤")) & "日"
            Width: =(Parent.Width - 64) / 2
            X: =32
            Y: =146
      - S5_DayVal:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(255, 255, 255, 1)
            Height: =30
            Text: |-
              =With({m: LookUp(CN_社員マスタ, 社員ID = gblEmpID)}, Text(CountRows(Filter(colAttend, 勤務区分.Value = "日勤")) * Coalesce(m.日勤手当, 0), "¥#,##0"))
            Width: =(Parent.Width - 64) / 2
            X: =16 + (Parent.Width - 32) / 2
            Y: =146
      - S5_NightCap:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =30
            Text: ="夜勤手当 × " & CountRows(Filter(colAttend, 勤務区分.Value = "夜勤")) & "日"
            Width: =(Parent.Width - 64) / 2
            X: =32
            Y: =180
      - S5_NightVal:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(255, 255, 255, 1)
            Height: =30
            Text: |-
              =With({m: LookUp(CN_社員マスタ, 社員ID = gblEmpID)}, Text(CountRows(Filter(colAttend, 勤務区分.Value = "夜勤")) * Coalesce(m.夜勤手当, 0), "¥#,##0"))
            Width: =(Parent.Width - 64) / 2
            X: =16 + (Parent.Width - 32) / 2
            Y: =180
      - S5_EarlyCap:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =30
            Text: ="早出手当 × " & CountRows(Filter(colAttend, 勤務区分.Value = "早出")) & "日"
            Width: =(Parent.Width - 64) / 2
            X: =32
            Y: =214
      - S5_EarlyVal:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(255, 255, 255, 1)
            Height: =30
            Text: |-
              =With({m: LookUp(CN_社員マスタ, 社員ID = gblEmpID)}, Text(CountRows(Filter(colAttend, 勤務区分.Value = "早出")) * Coalesce(m.早出手当, 0), "¥#,##0"))
            Width: =(Parent.Width - 64) / 2
            X: =16 + (Parent.Width - 32) / 2
            Y: =214
      - S5_TaxCap:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =30
            Text: ="税金控除"
            Width: =(Parent.Width - 64) / 2
            X: =32
            Y: =256
      - S5_TaxVal:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(255, 51, 51, 1)
            Height: =30
            Text: |-
              =With({m: LookUp(CN_社員マスタ, 社員ID = gblEmpID)}, "−" & Text(Coalesce(m.税金控除, 0), "¥#,##0"))
            Width: =(Parent.Width - 64) / 2
            X: =16 + (Parent.Width - 32) / 2
            Y: =256
      - S5_InsCap:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =30
            Text: ="保険控除"
            Width: =(Parent.Width - 64) / 2
            X: =32
            Y: =290
      - S5_InsVal:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(255, 51, 51, 1)
            Height: =30
            Text: |-
              =With({m: LookUp(CN_社員マスタ, 社員ID = gblEmpID)}, "−" & Text(Coalesce(m.保険控除, 0), "¥#,##0"))
            Width: =(Parent.Width - 64) / 2
            X: =16 + (Parent.Width - 32) / 2
            Y: =290
      - S5_NetCap:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =30
            Text: ="差引支給見込み"
            Width: =Parent.Width - 64
            X: =32
            Y: =340
      - S5_Net:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(0, 204, 102, 1)
            FontWeight: =FontWeight.Bold
            Height: =50
            Size: =26
            Text: |-
              =With({m: LookUp(CN_社員マスタ, 社員ID = gblEmpID)}, Text(Coalesce(m.基本給, 0) + CountRows(Filter(colAttend, 勤務区分.Value = "日勤")) * Coalesce(m.日勤手当, 0) + CountRows(Filter(colAttend, 勤務区分.Value = "夜勤")) * Coalesce(m.夜勤手当, 0) + CountRows(Filter(colAttend, 勤務区分.Value = "早出")) * Coalesce(m.早出手当, 0) - Coalesce(m.税金控除, 0) - Coalesce(m.保険控除, 0), "¥#,##0"))
            Width: =Parent.Width - 64
            X: =32
            Y: =370
      - S5_Note:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(120, 120, 120, 1)
            Height: =70
            Size: =11
            Text: ="※残業 " & CountRows(Filter(colAttend, 勤務区分.Value = "残業")) & "日分は単価の列がないため金額に含めていません。表示は見込みで、正式な給与計算ではありません。"
            Width: =Parent.Width - 32
            X: =16
            Y: =440
      - S5_NavBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(26, 58, 42, 1)
            Height: =70
            Width: =Parent.Width
            Y: =Parent.Height - 70
      - S5_Nav1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 204, 102, 0.3)
            OnSelect: =Navigate(S1_Home, ScreenTransition.None)
            PressedFill: =RGBA(0, 204, 102, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: ="ホーム"
            Width: =Parent.Width / 5
            X: =Parent.Width / 5 * 0
            Y: =Parent.Height - 70
      - S5_Nav2:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 204, 102, 0.3)
            OnSelect: =Navigate(S2_Calendar, ScreenTransition.None)
            PressedFill: =RGBA(0, 204, 102, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: ="カレンダー"
            Width: =Parent.Width / 5
            X: =Parent.Width / 5 * 1
            Y: =Parent.Height - 70
      - S5_Nav3:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 204, 102, 0.3)
            OnSelect: =Set(gblSelDate, Today()); Navigate(S3_Register, ScreenTransition.None)
            PressedFill: =RGBA(0, 204, 102, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: ="登録"
            Width: =Parent.Width / 5
            X: =Parent.Width / 5 * 2
            Y: =Parent.Height - 70
      - S5_Nav4:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(0, 204, 102, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 204, 102, 0.3)
            OnSelect: =Navigate(S4_Summary, ScreenTransition.None)
            PressedFill: =RGBA(0, 204, 102, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: ="集計"
            Width: =Parent.Width / 5
            X: =Parent.Width / 5 * 3
            Y: =Parent.Height - 70
      - S5_Nav5:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 204, 102, 0.3)
            OnSelect: '=Navigate(S7_Settings, ScreenTransition.None)    '
            PressedFill: =RGBA(0, 204, 102, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: ="設定"
            Width: =Parent.Width / 5
            X: =Parent.Width / 5 * 4
            Y: =Parent.Height - 70
