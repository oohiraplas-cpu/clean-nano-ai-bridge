Screens:
  S11_Report:
    Properties:
      Fill: '=RGBA(10, 10, 10, 1) '
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: '=Reset(penSign); Set(varBlankSignLen, Len(JSON(penSign.Image, JSONFormat.IncludeBinaryData)))    '
    Children:
      - S11_Report_MobileScroll:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height - 156
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            Width: =Parent.Width
            Y: =72
          Children:
            - S11_Report_MobileBody:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =Max(1012, Parent.Height)
                  LayoutMinHeight: =Max(1012, Parent.Height)
                  LayoutMinWidth: =0
                  Width: =Parent.Width
                Children:
                  - recFrame:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =10
                        Visible: =false
                        Width: =Parent.Width - 32
                        X: =16
                  - lblWorkDate:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =24
                        Text: ="作業日 *"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =16
                  - dpWorkDate:
                      Control: Classic/DatePicker@2.6.0
                      Properties:
                        Format: ="yyyy/mm/dd"
                        Height: =48
                        Size: =15
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =44
                  - lblEmp:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =24
                        Text: ="社員名 *"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =100
                  - txtEmp:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Default: =User().FullName
                        Fill: =RGBA(20, 28, 24, 1)
                        Height: =48
                        Size: =15
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =128
                  - lblSite:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =24
                        Text: ="現場 *"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =184
                  - ddSite:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(20, 28, 24, 1)
                        Height: =48
                        Items: =CN_現場台帳.現場名
                        Items.Value: =Title
                        Size: =15
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =212
                  - lblStart:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =24
                        Text: ="開始（例 8:00）"
                        Width: =(Parent.Width - 40) / 2
                        X: =16
                        Y: =268
                  - txtStart:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Default: ="8:00"
                        Fill: =RGBA(20, 28, 24, 1)
                        Height: =48
                        Size: =15
                        Width: =(Parent.Width - 40) / 2
                        X: =16
                        Y: =296
                  - lblEnd:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =24
                        Text: ="終了（例 17:00）"
                        Width: =(Parent.Width - 40) / 2
                        X: =24 + (Parent.Width - 40) / 2
                        Y: =268
                  - txtEnd:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Default: ="17:00"
                        Fill: =RGBA(20, 28, 24, 1)
                        Height: =48
                        Size: =15
                        Width: =(Parent.Width - 40) / 2
                        X: =24 + (Parent.Width - 40) / 2
                        Y: =296
                  - lblPeople:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =24
                        Text: ="人数"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =352
                  - txtPeople:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Default: ="1"
                        Fill: =RGBA(20, 28, 24, 1)
                        Format: =TextFormat.Number
                        Height: =48
                        Size: =15
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =380
                  - lblPrimeCompany:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =24
                        Text: ="元請会社"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =436
                  - txtPrimeCompany:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Default: =""
                        Fill: =RGBA(20, 28, 24, 1)
                        Height: =48
                        Size: =15
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =464
                  - lblPrimeContact:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =24
                        Text: ="元請担当者名 *"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =520
                  - txtPrimeContact:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Default: =""
                        Fill: =RGBA(20, 28, 24, 1)
                        Height: =48
                        Size: =15
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =548
                  - lblContent:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =24
                        Text: ="作業内容 *"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =604
                  - txtContent:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Default: =""
                        Fill: =RGBA(20, 28, 24, 1)
                        Height: =140
                        Mode: =TextMode.MultiLine
                        Size: =15
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =632
                  - lblSign:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =24
                        Text: ="元請電子サイン *（枠内に手書き）"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =784
                  - penSign:
                      Control: PenInput@2.3.0
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =180
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =812
      - lblReportTitle:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(0, 204, 102, 1)
            FontWeight: =FontWeight.Bold
            Height: =44
            Size: =20
            Text: ="日報入力"
            Width: =Parent.Width - 148
            X: =132
            Y: =16
      - btnReportBack:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(26, 58, 42, 1)
            Height: =44
            OnSelect: =Navigate(MainScreen1, ScreenTransition.None)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =13
            Text: ="← ホーム"
            Width: =108
            X: =16
            Y: =16
      - btnReportDraft:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 204, 102, 1)
            BorderThickness: =1
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: =If(varReportSaving, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(26, 58, 42, 1)
            Height: =52
            OnSelect: |-
              =If(
                  !varReportSaving,
                  Set(varReportSaving, true);
                  IfError(
                      If(
                          IsBlank(txtEmp.Text) || IsBlank(ddSite.Selected.現場名) || IsBlank(txtContent.Text) || IsBlank(txtPrimeContact.Text),
                          Notify("必須項目（社員名・現場・作業内容・元請担当者名）を入力してください", NotificationType.Error),
                          IsBlank(varBlankSignLen) || IsBlank(penSign.Image) || Len(JSON(penSign.Image, JSONFormat.IncludeBinaryData)) <= varBlankSignLen + 50,
                          Notify("元請電子サインを枠内に書いてください", NotificationType.Error),
                          IfError(
                              Patch(
                                  CN_電子日報台帳,
                                  Defaults(CN_電子日報台帳),
                                  {
                                      日報ID: "NP-" & Text(Now(), "yyyymmddhhmmss"),
                                      作業日: dpWorkDate.SelectedDate,
                                      社員名: txtEmp.Text,
                                      現場名: ddSite.Selected.現場名,
                                      作業開始時刻: If(IsBlank(txtStart.Text), Blank(), DateTimeValue(Text(dpWorkDate.SelectedDate, "yyyy-mm-dd") & " " & txtStart.Text)),
                                      作業終了時刻: If(IsBlank(txtEnd.Text), Blank(), DateTimeValue(Text(dpWorkDate.SelectedDate, "yyyy-mm-dd") & " " & txtEnd.Text)),
                                      人数: Value(txtPeople.Text),
                                      作業内容: txtContent.Text,
                                      元請会社: txtPrimeCompany.Text,
                                      元請担当者名: txtPrimeContact.Text,
                                      提出状態: {Value: "下書き"},
                                      元請電子サイン: penSign.Image
                                  }
                              ),
                              Notify("保存できませんでした：" & FirstError.Message, NotificationType.Error),
                              Notify("日報を保存しました（下書き）", NotificationType.Success);
                              Reset(txtContent); Reset(penSign)
                          )
                      ),
                      Notify("保存処理を完了できませんでした：" & FirstError.Message, NotificationType.Error)
                  );
                  Set(varReportSaving, false)
              )
            Size: =14
            Text: ="下書き保存"
            Width: =(Parent.Width - 40) / 2
            X: =16
            Y: =Parent.Height - 68
      - btnReportSubmit:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(0, 0, 0, 1)
            DisplayMode: =If(varReportSaving, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(0, 204, 102, 1)
            FontWeight: =FontWeight.Bold
            Height: =52
            OnSelect: |-
              =If(
                  !varReportSaving,
                  Set(varReportSaving, true);
                  IfError(
                      If(
                          IsBlank(txtEmp.Text) || IsBlank(ddSite.Selected.現場名) || IsBlank(txtContent.Text) || IsBlank(txtPrimeContact.Text),
                          Notify("必須項目（社員名・現場・作業内容・元請担当者名）を入力してください", NotificationType.Error),
                          IsBlank(varBlankSignLen) || IsBlank(penSign.Image) || Len(JSON(penSign.Image, JSONFormat.IncludeBinaryData)) <= varBlankSignLen + 50,
                          Notify("元請電子サインを枠内に書いてください", NotificationType.Error),
                          IfError(
                              Patch(
                                  CN_電子日報台帳,
                                  Defaults(CN_電子日報台帳),
                                  {
                                      日報ID: "NP-" & Text(Now(), "yyyymmddhhmmss"),
                                      作業日: dpWorkDate.SelectedDate,
                                      社員名: txtEmp.Text,
                                      現場名: ddSite.Selected.現場名,
                                      作業開始時刻: If(IsBlank(txtStart.Text), Blank(), DateTimeValue(Text(dpWorkDate.SelectedDate, "yyyy-mm-dd") & " " & txtStart.Text)),
                                      作業終了時刻: If(IsBlank(txtEnd.Text), Blank(), DateTimeValue(Text(dpWorkDate.SelectedDate, "yyyy-mm-dd") & " " & txtEnd.Text)),
                                      人数: Value(txtPeople.Text),
                                      作業内容: txtContent.Text,
                                      元請会社: txtPrimeCompany.Text,
                                      元請担当者名: txtPrimeContact.Text,
                                      提出状態: {Value: "提出済"},
                                      元請署名状態: {Value: "署名済"},
                                      元請電子サイン: penSign.Image
                                  }
                              ),
                              Notify("保存できませんでした：" & FirstError.Message, NotificationType.Error),
                              Notify("日報を保存しました（提出済）", NotificationType.Success);
                              Reset(txtContent); Reset(penSign)
                          )
                      ),
                      Notify("保存処理を完了できませんでした：" & FirstError.Message, NotificationType.Error)
                  );
                  Set(varReportSaving, false)
              )
            Size: =14
            Text: ="提出"
            Width: =(Parent.Width - 40) / 2
            X: =24 + (Parent.Width - 40) / 2
            Y: =Parent.Height - 68
