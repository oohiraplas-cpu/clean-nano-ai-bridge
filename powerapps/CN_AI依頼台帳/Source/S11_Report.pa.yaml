Screens:
  S11_Report:
    Properties:
      Fill: '=RGBA(10, 10, 10, 1) '
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Reset(penSign); Set(varBlankSignLen, Len(JSON(penSign.Image, JSONFormat.IncludeBinaryData))); Clear(colReportWorkers); Set(gblCalendarCountSafe, false);
        If(gblReportFromCalendar,
         IfError(
          Refresh(CN_勤怠明細台帳);
          ClearCollect(colReportDay, Filter(CN_勤怠明細台帳, 開始日時 >= gblSelDate, 開始日時 < DateAdd(gblSelDate, 1, TimeUnit.Days)));
          If(CountRows(colReportDay) >= 500, Notify("登録件数が多いため人数を確定できません。集計方法の確認が必要です", NotificationType.Error),
           ClearCollect(colReportWorkers,
            Filter(AddColumns(colReportDay, CNReportSite, IfError(Text(ParseJSON(原入力).siteName), ""), CNReportPrime, IfError(Text(ParseJSON(原入力).primeCompany), ""), CNReportSchema, IfError(Value(ParseJSON(原入力).schemaVersion), 0)),
             CNReportSchema = 1 && CNReportSite = gblReportSite && CNReportPrime = gblReportPrime && !IsBlank(社員レコードキー) && レコード状態.Value = "Submitted"));
           Set(gblCalendarCountSafe, true)
          ),
          Notify("カレンダー集計に失敗しました：" & FirstError.Message, NotificationType.Error)
         )
        );
        Reset(dpWorkDate); Reset(txtSiteManual); Reset(txtStart); Reset(txtEnd); Reset(txtPeople); Reset(txtPrimeCompany); Reset(txtPrimeContact); Reset(txtContent)
    Children:
      - S11_Report_MobileScroll:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height - 168
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            Width: =Parent.Width
            Y: =72
          Children:
            - S11_Report_MobileBody:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =Max(1620, Parent.Height)
                  LayoutMinHeight: =Max(1620, Parent.Height)
                  LayoutMinWidth: =0
                  Width: =Parent.Width
                Children:
                  - recFrame:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =10
                        Visible: =false
                        Width: =Parent.Width - 32
                        X: =16
                  - lblWorkDate:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =32
                        Size: =18
                        Text: ="作業日 *"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =16
                  - dpWorkDate:
                      Control: Classic/DatePicker@2.6.0
                      Properties:
                        DefaultDate: =If(gblReportFromCalendar, gblSelDate, Today())
                        DisplayMode: =If(gblReportFromCalendar, DisplayMode.View, DisplayMode.Edit)
                        Format: ="yyyy/mm/dd"
                        Height: =64
                        Size: =18
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =52
                  - lblEmp:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =32
                        Size: =18
                        Text: ="社員名 *"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =128
                  - txtEmp:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Default: =User().FullName
                        DisplayMode: =DisplayMode.View
                        Fill: =RGBA(20, 28, 24, 1)
                        Height: =64
                        Size: =18
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =164
                  - lblSite:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =32
                        Size: =18
                        Text: ="現場 *"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =240
                  - ddSite:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(20, 28, 24, 1)
                        Visible: =!gblReportFromCalendar
                        Height: =64
                        Items: =CN_現場台帳.現場名
                        Items.Value: =Title
                        Size: =18
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =276
                  - txtSiteManual:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(20, 28, 24, 1)
                        Height: =64
                        Size: =18
                        Width: =Parent.Width - 32
                        X: =16
                        Default: =If(gblReportFromCalendar, gblReportSite, "")
                        DisplayMode: =If(gblReportFromCalendar, DisplayMode.View, DisplayMode.Edit)
                        HintText: ="現場名を手入力（入力するとこちらを優先）"
                        Y: =352
                  - lblStart:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =32
                        Size: =18
                        Text: ="開始（例 8:00）"
                        Width: =(Parent.Width - 40) / 2
                        X: =16
                        Y: =448
                  - txtStart:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Default: =If(gblReportFromCalendar, Text(gblReportStart, "hh:mm"), "8:00")
                        Fill: =RGBA(20, 28, 24, 1)
                        Height: =64
                        Size: =18
                        Width: =(Parent.Width - 40) / 2
                        X: =16
                        Y: =484
                  - lblEnd:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =32
                        Size: =18
                        Text: ="終了（例 17:00）"
                        Width: =(Parent.Width - 40) / 2
                        X: =24 + (Parent.Width - 40) / 2
                        Y: =448
                  - txtEnd:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Default: =If(gblReportFromCalendar, Text(gblReportEnd, "hh:mm"), "17:00")
                        Fill: =RGBA(20, 28, 24, 1)
                        Height: =64
                        Size: =18
                        Width: =(Parent.Width - 40) / 2
                        X: =24 + (Parent.Width - 40) / 2
                        Y: =484
                  - lblPeople:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =36
                        Size: =15
                        Text: ="人数（カレンダー登録から自動集計）"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =560
                  - txtPeople:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Default: =Text(CountRows(Distinct(colReportWorkers, 社員レコードキー)))
                        DisplayMode: =DisplayMode.View
                        Fill: =RGBA(20, 28, 24, 1)
                        Format: =TextFormat.Number
                        Height: =64
                        Size: =18
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =596
                  - lblPrimeCompany:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =32
                        Size: =18
                        Text: ="元請会社"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =672
                  - ddPrimeCompany:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(20, 28, 24, 1)
                        DisplayMode: =If(gblReportFromCalendar, DisplayMode.View, DisplayMode.Edit)
                        Height: =64
                        Size: =18
                        Width: =Parent.Width - 32
                        X: =16
                        AllowEmptySelection: =true
                        Default: =""
                        Items: =Sort(Distinct(Filter(CN_電子日報台帳, !IsBlank(元請会社)), 元請会社), Value)
                        Items.Value: =Value
                        OnChange: =Reset(txtPrimeCompany)
                        Y: =708
                  - txtPrimeCompany:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Default: =If(gblReportFromCalendar, gblReportPrime, Coalesce(ddPrimeCompany.Selected.Value, ""))
                        DisplayMode: =If(gblReportFromCalendar, DisplayMode.View, DisplayMode.Edit)
                        Fill: =RGBA(20, 28, 24, 1)
                        Height: =64
                        Size: =18
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =788
                  - lblPrimeContact:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =32
                        Size: =18
                        Text: ="元請担当者名 *"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =864
                  - ddPrimeContact:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(20, 28, 24, 1)
                        DisplayMode: =If(gblReportFromCalendar, DisplayMode.View, DisplayMode.Edit)
                        Height: =64
                        Size: =18
                        Width: =Parent.Width - 32
                        X: =16
                        AllowEmptySelection: =true
                        Default: =""
                        Items: =Sort(Distinct(Filter(CN_電子日報台帳, !IsBlank(元請担当者名) && (IsBlank(txtPrimeCompany.Text) || 元請会社 = txtPrimeCompany.Text)), 元請担当者名), Value)
                        Items.Value: =Value
                        OnChange: =Reset(txtPrimeContact)
                        Y: =900
                  - txtPrimeContact:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Default: =If(gblReportFromCalendar, gblReportContact, Coalesce(ddPrimeContact.Selected.Value, ""))
                        Fill: =RGBA(20, 28, 24, 1)
                        Height: =64
                        Size: =18
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =980
                  - lblContent:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =32
                        Size: =18
                        Text: ="作業内容 *"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =1056
                  - txtContent:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Default: =If(gblReportFromCalendar, gblReportContent, "")
                        Fill: =RGBA(20, 28, 24, 1)
                        Height: =160
                        Mode: =TextMode.MultiLine
                        Size: =18
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =1092
                  - lblSign:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =32
                        Size: =18
                        Text: ="元請電子サイン *（枠内に手書き）"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =1264
                  - penSign:
                      Control: PenInput@2.3.0
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =300
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =1300
      - lblReportTitle:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(0, 204, 102, 1)
            FontWeight: =FontWeight.Bold
            Height: =44
            Size: =20
            Text: ="日報確認・追記"
            Width: =Parent.Width - 148
            X: =132
            Y: =16
      - btnReportBack:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(26, 58, 42, 1)
            Height: =44
            OnSelect: =Navigate(MainScreen1, ScreenTransition.None)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =13
            Text: ="← ホーム"
            Width: =108
            X: =16
            Y: =16
      - btnReportDraft:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 204, 102, 1)
            BorderThickness: =1
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: =If(varReportSaving, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(26, 58, 42, 1)
            Height: =64
            OnSelect: |-
              =If(
                  !varReportSaving,
                  Set(varReportSaving, true);
                  IfError(
                      If(
                          !gblReportFromCalendar || !gblCalendarCountSafe || CountRows(Distinct(colReportWorkers, 社員レコードキー)) = 0,
                          Notify("先にカレンダーで同じ日・現場・元請会社の全員を登録してください", NotificationType.Error),
                          IsBlank(User().FullName) || IsBlank(Coalesce(Trim(txtSiteManual.Text), ddSite.Selected.現場名)) || IsBlank(txtContent.Text) || IsBlank(txtPrimeContact.Text),
                          Notify("必須項目（社員名・現場・作業内容・元請担当者名）を入力してください", NotificationType.Error),
                          IsBlank(varBlankSignLen) || IsBlank(penSign.Image) || Len(JSON(penSign.Image, JSONFormat.IncludeBinaryData)) <= varBlankSignLen + 50,
                          Notify("元請電子サインを枠内に書いてください", NotificationType.Error),
                          IfError(
                              Patch(
                                  CN_電子日報台帳,
                                  Defaults(CN_電子日報台帳),
                                  {
                                      日報ID: "NP-" & Text(Now(), "yyyymmddhhmmss"),
                                      作業日: dpWorkDate.SelectedDate,
                                      社員名: User().FullName,
                                      現場名: Coalesce(Trim(txtSiteManual.Text), ddSite.Selected.現場名),
                                      作業開始時刻: If(IsBlank(txtStart.Text), Blank(), DateTimeValue(Text(dpWorkDate.SelectedDate, "yyyy-mm-dd") & " " & txtStart.Text)),
                                      作業終了時刻: If(IsBlank(txtEnd.Text), Blank(), DateTimeValue(Text(dpWorkDate.SelectedDate, "yyyy-mm-dd") & " " & txtEnd.Text)),
                                      人数: CountRows(Distinct(colReportWorkers, 社員レコードキー)),
                                      作業内容: txtContent.Text,
                                      元請会社: txtPrimeCompany.Text,
                                      元請担当者名: txtPrimeContact.Text,
                                      提出状態: {Value: "下書き"},
                                      元請電子サイン: penSign.Image
                                  }
                              ),
                              Notify("保存できませんでした：" & FirstError.Message, NotificationType.Error),
                              Notify("日報を保存しました（下書き）", NotificationType.Success);
                              Reset(txtContent); Reset(penSign)
                          )
                      ),
                      Notify("保存処理を完了できませんでした：" & FirstError.Message, NotificationType.Error)
                  );
                  Set(varReportSaving, false)
              )
            Size: =18
            Text: ="下書き保存"
            Width: =(Parent.Width - 40) / 2
            X: =16
            Y: =Parent.Height - 80
      - btnReportSubmit:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(0, 0, 0, 1)
            DisplayMode: =If(varReportSaving, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(0, 204, 102, 1)
            FontWeight: =FontWeight.Bold
            Height: =64
            OnSelect: |-
              =If(
                  !varReportSaving,
                  Set(varReportSaving, true);
                  IfError(
                      If(
                          !gblReportFromCalendar || !gblCalendarCountSafe || CountRows(Distinct(colReportWorkers, 社員レコードキー)) = 0,
                          Notify("先にカレンダーで同じ日・現場・元請会社の全員を登録してください", NotificationType.Error),
                          IsBlank(User().FullName) || IsBlank(Coalesce(Trim(txtSiteManual.Text), ddSite.Selected.現場名)) || IsBlank(txtContent.Text) || IsBlank(txtPrimeContact.Text),
                          Notify("必須項目（社員名・現場・作業内容・元請担当者名）を入力してください", NotificationType.Error),
                          IsBlank(varBlankSignLen) || IsBlank(penSign.Image) || Len(JSON(penSign.Image, JSONFormat.IncludeBinaryData)) <= varBlankSignLen + 50,
                          Notify("元請電子サインを枠内に書いてください", NotificationType.Error),
                          IfError(
                              Patch(
                                  CN_電子日報台帳,
                                  Defaults(CN_電子日報台帳),
                                  {
                                      日報ID: "NP-" & Text(Now(), "yyyymmddhhmmss"),
                                      作業日: dpWorkDate.SelectedDate,
                                      社員名: User().FullName,
                                      現場名: Coalesce(Trim(txtSiteManual.Text), ddSite.Selected.現場名),
                                      作業開始時刻: If(IsBlank(txtStart.Text), Blank(), DateTimeValue(Text(dpWorkDate.SelectedDate, "yyyy-mm-dd") & " " & txtStart.Text)),
                                      作業終了時刻: If(IsBlank(txtEnd.Text), Blank(), DateTimeValue(Text(dpWorkDate.SelectedDate, "yyyy-mm-dd") & " " & txtEnd.Text)),
                                      人数: CountRows(Distinct(colReportWorkers, 社員レコードキー)),
                                      作業内容: txtContent.Text,
                                      元請会社: txtPrimeCompany.Text,
                                      元請担当者名: txtPrimeContact.Text,
                                      提出状態: {Value: "提出済"},
                                      元請署名状態: {Value: "署名済"},
                                      元請電子サイン: penSign.Image
                                  }
                              ),
                              Notify("保存できませんでした：" & FirstError.Message, NotificationType.Error),
                              Notify("日報を保存しました（提出済）", NotificationType.Success);
                              Reset(txtContent); Reset(penSign)
                          )
                      ),
                      Notify("保存処理を完了できませんでした：" & FirstError.Message, NotificationType.Error)
                  );
                  Set(varReportSaving, false)
              )
            Size: =18
            Text: ="提出"
            Width: =(Parent.Width - 40) / 2
            X: =24 + (Parent.Width - 40) / 2
            Y: =Parent.Height - 80
