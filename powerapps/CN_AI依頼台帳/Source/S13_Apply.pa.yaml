Screens:
  S13_Apply:
    Properties:
      Fill: =RGBA(10, 10, 10, 1)
      OnVisible: |-
        =UpdateContext({locType: "残業", locViewAll: false, locIsApprover: Lower(User().Email) = "k.k.hisyoengineer@hisyoengineer.onmicrosoft.com"})
    Children:
      - S13_Back:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 204, 102, 1)
            BorderThickness: =1
            Color: =RGBA(0, 204, 102, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =44
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 204, 102, 0.3)
            OnSelect: =Navigate(MainScreen1, ScreenTransition.None)
            PressedFill: =RGBA(0, 204, 102, 1)
            Size: =12
            Text: ="← ホーム"
            Width: =140
            X: =16
            Y: =16
      - S13_Title:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(0, 204, 102, 1)
            FontWeight: =FontWeight.Bold
            Height: =44
            Size: =22
            Text: ="残業・早出申請"
            Width: =400
            X: =172
            Y: =16
      - S13_LblType:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(160, 160, 160, 1)
            Height: =28
            Size: =12
            Text: ="申請種別"
            Width: =200
            X: =16
            Y: =80
      - S13_TypeOver:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 204, 102, 1)
            BorderThickness: =1
            Color: =If(locType = "残業", RGBA(10, 10, 10, 1), RGBA(0, 204, 102, 1))
            Fill: =If(locType = "残業", RGBA(0, 204, 102, 1), RGBA(26, 58, 42, 1))
            FontWeight: =FontWeight.Bold
            OnSelect: |-
              =UpdateContext({locType: "残業"})
            Size: =13
            Text: ="残業"
            Width: =140
            X: =16
            Y: =112
      - S13_TypeEarly:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 204, 102, 1)
            BorderThickness: =1
            Color: =If(locType = "早出", RGBA(10, 10, 10, 1), RGBA(0, 204, 102, 1))
            Fill: =If(locType = "早出", RGBA(0, 204, 102, 1), RGBA(26, 58, 42, 1))
            FontWeight: =FontWeight.Bold
            OnSelect: |-
              =UpdateContext({locType: "早出"})
            Size: =13
            Text: ="早出"
            Width: =140
            X: =164
            Y: =112
      - S13_LblDate:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(160, 160, 160, 1)
            Height: =28
            Size: =12
            Text: ="対象日"
            Width: =200
            X: =16
            Y: =164
      - S13_Date:
          Control: Classic/DatePicker@2.6.0
          Properties:
            BorderColor: =RGBA(0, 204, 102, 1)
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(26, 58, 42, 1)
            Format: ="yyyy/mm/dd"
            Size: =13
            Width: =288
            X: =16
            Y: =194
      - S13_LblStart:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(160, 160, 160, 1)
            Height: =28
            Size: =12
            Text: ="開始（例 17:00）"
            Width: =140
            X: =16
            Y: =244
      - S13_LblEnd:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(160, 160, 160, 1)
            Height: =28
            Size: =12
            Text: ="終了（例 19:00）"
            Width: =140
            X: =164
            Y: =244
      - S13_Start:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 204, 102, 1)
            Color: =RGBA(255, 255, 255, 1)
            Default: =If(locType = "早出", "06:00", "17:00")
            Fill: =RGBA(26, 58, 42, 1)
            HintText: ="17:00"
            Width: =140
            X: =16
            Y: =274
      - S13_End:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 204, 102, 1)
            Color: =RGBA(255, 255, 255, 1)
            Default: =If(locType = "早出", "08:00", "19:00")
            Fill: =RGBA(26, 58, 42, 1)
            HintText: ="19:00"
            Width: =140
            X: =164
            Y: =274
      - S13_Hours:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Size: =15
            Text: =If(IsBlank(S13_Calc.Text), "時刻を 17:00 の形で入力", S13_Calc.Text & " 時間")
            Width: =300
            X: =320
            Y: =274
      - S13_Calc:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(0, 0, 0, 0)
            Height: =10
            Size: =8
            Text: =IfError(Text(DateDiff(TimeValue(S13_Start.Text), TimeValue(S13_End.Text), TimeUnit.Minutes) / 60, "0.00"), "")
            Visible: =false
            Width: =10
            X: =320
            Y: =244
      - S13_LblSite:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(160, 160, 160, 1)
            Height: =28
            Size: =12
            Text: ="現場"
            Width: =200
            X: =16
            Y: =324
      - S13_Site:
          Control: Classic/DropDown@2.3.1
          Properties:
            BorderColor: =RGBA(0, 204, 102, 1)
            ChevronBackground: =RGBA(0, 204, 102, 1)
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(26, 58, 42, 1)
            Items: =Sort(Distinct(CN_現場台帳, Title), Value)
            Items.Value: =Value
            Width: =604
            X: =16
            Y: =354
      - S13_LblReason:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(160, 160, 160, 1)
            Height: =28
            Size: =12
            Text: ="理由・作業内容"
            Width: =200
            X: =16
            Y: =404
      - S13_Reason:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 204, 102, 1)
            Color: =RGBA(255, 255, 255, 1)
            Default: =""
            Fill: =RGBA(26, 58, 42, 1)
            Height: =110
            HintText: ="例：解体作業の遅れのため"
            Mode: =TextMode.MultiLine
            Width: =604
            X: =16
            Y: =434
      - S13_Submit:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(10, 10, 10, 1)
            Fill: =RGBA(0, 204, 102, 1)
            FontWeight: =FontWeight.Bold
            Height: =52
            OnSelect: |-
              =If(
                  IsBlank(S13_Calc.Text) || Value(S13_Calc.Text) <= 0,
                  Notify("開始・終了の時刻を 17:00 の形で正しく入力してください", NotificationType.Error),
                  IsBlank(Trim(S13_Reason.Text)),
                  Notify("理由を入力してください", NotificationType.Error),
                  Patch(
                      CN_申請台帳,
                      Defaults(CN_申請台帳),
                      {
                          件名: locType & " " & Text(S13_Date.SelectedDate, "yyyy/mm/dd") & " " & User().FullName,
                          申請種別: {Value: locType},
                          申請者名: User().FullName,
                          申請者メール: User().Email,
                          対象日: S13_Date.SelectedDate,
                          開始時刻: S13_Start.Text,
                          終了時刻: S13_End.Text,
                          時間数: Value(S13_Calc.Text),
                          現場名: S13_Site.Selected.Value,
                          理由: S13_Reason.Text,
                          ステータス: {Value: "申請中"}
                      }
                  );
                  If(
                      IsEmpty(Errors(CN_申請台帳)),
                      Notify("申請しました", NotificationType.Success); Reset(S13_Reason),
                      Notify("保存できませんでした：" & First(Errors(CN_申請台帳)).Message, NotificationType.Error)
                  )
              )
            PressedFill: =RGBA(0, 160, 80, 1)
            Text: ="申請する"
            Width: =604
            X: =16
            Y: =560
      - S13_ListTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(0, 204, 102, 1)
            FontWeight: =FontWeight.Bold
            Height: =32
            Size: =15
            Text: =If(locViewAll, "全員の申請", "自分の申請")
            Width: =300
            X: =660
            Y: =80
      - S13_ViewToggle:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 204, 102, 1)
            BorderThickness: =1
            Color: =RGBA(0, 204, 102, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 204, 102, 0.3)
            OnSelect: |-
              =UpdateContext({locViewAll: !locViewAll})
            PressedFill: =RGBA(0, 204, 102, 1)
            Size: =12
            Text: =If(locViewAll, "自分の申請を表示", "全員の申請を表示")
            Visible: =locIsApprover
            Width: =200
            X: =Parent.Width - 216
            Y: =76
      - S13_List:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Height: =Parent.Height - 124 - 16
            Items: |-
              =Sort(
                  If(
                      locViewAll,
                      CN_申請台帳,
                      Filter(CN_申請台帳, 申請者メール = User().Email)
                  ),
                  対象日,
                  SortOrder.Descending
              )
            TemplateFill: =RGBA(26, 58, 42, 1)
            TemplatePadding: =3
            TemplateSize: =96
            Width: =Parent.Width - 660 - 16
            X: =660
            Y: =124
          Children:
            - S13_ItemHead:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(255, 255, 255, 1)
                  FontWeight: =FontWeight.Bold
                  Height: =30
                  Size: =12
                  Text: =ThisItem.申請種別.Value & "　" & Text(ThisItem.対象日, "yyyy/mm/dd") & "　" & ThisItem.開始時刻 & "〜" & ThisItem.終了時刻 & "（" & ThisItem.時間数 & "h）"
                  Width: =Parent.TemplateWidth - 150
                  X: =12
                  Y: =6
            - S13_ItemSub:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(160, 160, 160, 1)
                  Height: =26
                  Size: =11
                  Text: =ThisItem.申請者名 & "　" & ThisItem.現場名 & If(IsBlank(ThisItem.承認者), "", "　承認者 " & ThisItem.承認者)
                  Width: =Parent.TemplateWidth - 150
                  X: =12
                  Y: =36
            - S13_ItemReason:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(200, 200, 200, 1)
                  Height: =26
                  Size: =11
                  Text: =ThisItem.理由
                  Width: =Parent.TemplateWidth - 300
                  X: =12
                  Y: =62
            - S13_ItemStatus:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =If(ThisItem.ステータス.Value = "申請中", RGBA(10, 10, 10, 1), RGBA(255, 255, 255, 1))
                  Fill: =Switch(ThisItem.ステータス.Value, "承認", RGBA(0, 153, 76, 1), "却下", RGBA(204, 51, 51, 1), RGBA(255, 204, 0, 1))
                  FontWeight: =FontWeight.Bold
                  Height: =30
                  Size: =12
                  Text: =ThisItem.ステータス.Value
                  Width: =120
                  X: =Parent.TemplateWidth - 132
                  Y: =8
            - S13_ItemApprove:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Color: =RGBA(10, 10, 10, 1)
                  Fill: =RGBA(0, 204, 102, 1)
                  FontWeight: =FontWeight.Bold
                  Height: =32
                  OnSelect: |-
                    =Patch(CN_申請台帳, ThisItem, {ステータス: {Value: "承認"}, 承認者: User().FullName})
                  Size: =11
                  Text: ="承認"
                  Visible: =locIsApprover && ThisItem.ステータス.Value = "申請中"
                  Width: =120
                  X: =Parent.TemplateWidth - 264
                  Y: =56
            - S13_ItemReject:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Color: =RGBA(255, 255, 255, 1)
                  Fill: =RGBA(204, 51, 51, 1)
                  FontWeight: =FontWeight.Bold
                  Height: =32
                  OnSelect: |-
                    =Patch(CN_申請台帳, ThisItem, {ステータス: {Value: "却下"}, 承認者: User().FullName})
                  Size: =11
                  Text: ="却下"
                  Visible: =locIsApprover && ThisItem.ステータス.Value = "申請中"
                  Width: =120
                  X: =Parent.TemplateWidth - 132
                  Y: =56
      - S13_Empty:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(160, 160, 160, 1)
            Text: ="申請はまだありません"
            Visible: =CountRows(S13_List.AllItems) = 0
            Width: =690
            X: =660
            Y: =160
