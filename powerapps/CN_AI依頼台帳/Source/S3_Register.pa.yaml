Screens:
  S3_Register:
    Properties:
      Fill: =RGBA(10, 10, 10, 1)
      OnVisible: =If(IsBlank(gblCalType) || gblCalType = "運営", Set(gblCalType, "解体")); If(IsBlank(gblSelDate), Set(gblSelDate, Today())); Set(gblSaving, false)
    Children:
      - S3_RegisterScroll:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height - 70
            Width: =Parent.Width
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutOverflowY: =LayoutOverflow.Scroll
          Children:
            - S3_RegisterBody:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Height: =1324
                  LayoutMinHeight: =1324
                  FillPortions: =0
                  Width: =Parent.Width
                  LayoutMinWidth: =0
                Children:
                  - S3_Title:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255,255,255,1)
                        Height: =36
                        Size: =18
                        Text: ="カレンダー登録"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =16
                  - S3_Date:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255,255,255,1)
                        Height: =36
                        Size: =18
                        Text: ="日付"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =64
                  - S3_WorkDate:
                      Control: Classic/DatePicker@2.6.0
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(26, 58, 42, 1)
                        Height: =64
                        Size: =18
                        Width: =Parent.Width - 32
                        X: =16
                        DefaultDate: =Coalesce(gblSelDate, Today())
                        Format: ="yyyy/mm/dd"
                        OnChange: =Set(gblSelDate, Self.SelectedDate)
                        Y: =104
                  - S3_WorkersCap:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255,255,255,1)
                        Height: =36
                        Size: =18
                        Text: ="同じ現場の作業員（全員を選択）"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =180
                  - S3_Workers:
                      Control: Classic/ComboBox@2.4.0
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(26, 58, 42, 1)
                        Height: =64
                        Size: =18
                        Width: =Parent.Width - 32
                        X: =16
                        Items: =CN_社員台帳
                        DisplayFields: =["Title"]
                        SearchFields: =["Title"]
                        SelectMultiple: =true
                        IsSearchable: =true
                        DefaultSelectedItems: =Filter(CN_社員台帳, EmployeeID = gblEmpID)
                        Y: =220
                  - S3_SiteCap:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255,255,255,1)
                        Height: =36
                        Size: =18
                        Text: ="現場"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =296
                  - S3_Site:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(26, 58, 42, 1)
                        Height: =64
                        Size: =18
                        Width: =Parent.Width - 32
                        X: =16
                        Items: =Sort(CN_現場台帳, Title).Title
                        Items.Value: =Title
                        AllowEmptySelection: =true
                        Default: =""
                        Y: =336
                  - S3_SiteManual:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(26, 58, 42, 1)
                        Height: =64
                        Size: =18
                        Width: =Parent.Width - 32
                        X: =16
                        Default: =""
                        Y: =412
                        HintText: ="現場名を手入力（入力を優先）"
                  - S3_PrimeCap:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255,255,255,1)
                        Height: =36
                        Size: =18
                        Text: ="元請会社"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =488
                  - S3_Prime:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(26, 58, 42, 1)
                        Height: =64
                        Size: =18
                        Width: =Parent.Width - 32
                        X: =16
                        Default: =Coalesce(LookUp(CN_現場台帳, Title = S3_Site.Selected.Title).PrimeContractor, "")
                        Y: =528
                  - S3_ContactCap:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255,255,255,1)
                        Height: =36
                        Size: =18
                        Text: ="元請担当者名"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =604
                  - S3_Contact:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(26, 58, 42, 1)
                        Height: =64
                        Size: =18
                        Width: =Parent.Width - 32
                        X: =16
                        Default: =""
                        Y: =644
                  - S3_StatusCap:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255,255,255,1)
                        Height: =36
                        Size: =18
                        Text: ="勤務区分"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =720
                  - S3_Status:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(26, 58, 42, 1)
                        Height: =64
                        Size: =18
                        Width: =Parent.Width - 32
                        X: =16
                        Items: =["日勤", "夜勤", "早出", "残業"]
                        Items.Value: =Value
                        Default: ="日勤"
                        Y: =760
                  - S3_TimeCap:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255,255,255,1)
                        Height: =36
                        Size: =18
                        Text: ="開始 ／ 終了"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =836
                  - S3_Start:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(26, 58, 42, 1)
                        Height: =64
                        Size: =18
                        Width: =(Parent.Width - 40) / 2
                        X: =16
                        Items: =ForAll(Sequence(48, 0), Text(Time(0, Value * 30, 0), "hh:mm"))
                        Items.Value: =Value
                        Default: ="08:00"
                        Y: =876
                  - S3_End:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(26, 58, 42, 1)
                        Height: =64
                        Size: =18
                        Width: =(Parent.Width - 40) / 2
                        X: =24 + (Parent.Width - 40) / 2
                        Items: =ForAll(Sequence(48, 0), Text(Time(0, Value * 30, 0), "hh:mm"))
                        Items.Value: =Value
                        Default: ="17:00"
                        Y: =876
                  - S3_BreakCap:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255,255,255,1)
                        Height: =36
                        Size: =18
                        Text: ="休憩（分）"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =952
                  - S3_Break:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(26, 58, 42, 1)
                        Height: =64
                        Size: =18
                        Width: =Parent.Width - 32
                        X: =16
                        Items: =[0, 30, 45, 60, 90]
                        Items.Value: =Value
                        Default: =60
                        Y: =992
                  - S3_NoteCap:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255,255,255,1)
                        Height: =36
                        Size: =18
                        Text: ="作業内容・メモ"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =1068
                  - S3_Note:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(26, 58, 42, 1)
                        Height: =120
                        Size: =18
                        Width: =Parent.Width - 32
                        X: =16
                        Default: =""
                        Y: =1108
                        Mode: =TextMode.MultiLine
                  - S3_Save:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(10,10,10,1)
                        Fill: =RGBA(0,204,102,1)
                        Height: =64
                        Size: =18
                        Width: =Parent.Width - 32
                        X: =16
                        DisplayMode: =If(gblSaving, DisplayMode.Disabled, DisplayMode.Edit)
                        Text: ="全員を登録 → 日報へ"
                        OnSelect: |-
                          =If(!gblSaving,
                           With({siteName: Coalesce(Trim(S3_SiteManual.Text), S3_Site.Selected.Title), company: Trim(S3_Prime.Text), s: DateTimeValue(Text(gblSelDate, "yyyy-mm-dd") & " " & S3_Start.Selected.Value), e0: DateTimeValue(Text(gblSelDate, "yyyy-mm-dd") & " " & S3_End.Selected.Value)},
                            With({e: If(e0 <= s, DateAdd(e0, 1, TimeUnit.Days), e0)},
                             If(IsEmpty(S3_Workers.SelectedItems), Notify("全員の作業員を選択してください", NotificationType.Error),
                              IsBlank(siteName) || IsBlank(company), Notify("現場名と元請会社を入力してください", NotificationType.Error),
                              DateDiff(s, e, TimeUnit.Minutes) <= S3_Break.Selected.Value, Notify("時刻と休憩を確認してください", NotificationType.Error),
                              Set(gblSaving, true); Clear(colCalendarErrors);
                              ForAll(S3_Workers.SelectedItems As worker,
                               With({k: worker.EmployeeID & "_" & Text(gblSelDate, "yyyymmdd")},
                                If(IsBlank(worker.EmployeeID), Collect(colCalendarErrors, {workerName: worker.Title, message: "社員IDが未登録です"}); false,
                                 !IsBlank(LookUp(CN_勤怠明細台帳, AttendanceKey = k)),
        With({existing: LookUp(CN_勤怠明細台帳, AttendanceKey = k)},
         If(IfError(Text(ParseJSON(existing.OriginalInput).siteName), "") <> siteName || IfError(Text(ParseJSON(existing.OriginalInput).primeCompany), "") <> company,
          Collect(colCalendarErrors, {workerName: worker.Title, message: "別の現場・元請で登録済みです"}); false, true)),

                                 IfError(
                                  Patch(CN_勤怠明細台帳, Defaults(CN_勤怠明細台帳), {
                                   Title: "出勤_" & k, AttendanceKey: k, DailyReportKey: "未連携", EmployeeRecordKey: worker.EmployeeID,
                                   DeviceSubmissionId: GUID(), RecordStatus: {Value: "Submitted"}, StartAt: s, EndAt: e,
                                   BreakMinutes: S3_Break.Selected.Value, WorkStatus: {Value: S3_Status.Selected.Value}, WorkType: {Value: gblCalType},
                                   SiteID: If(IsBlank(Trim(S3_SiteManual.Text)), LookUp(CN_現場台帳, Title = S3_Site.Selected.Title).SiteID, Blank()),
                                   Notes: S3_Note.Text,
                                   OriginalInput: JSON({schemaVersion: 1, siteName: siteName, primeCompany: company, primeContact: Trim(S3_Contact.Text), employeeName: worker.Title, workContent: S3_Note.Text}, JSONFormat.Compact)
                                  }); true,
                                  Collect(colCalendarErrors, {workerName: worker.Title, message: FirstError.Message}); false
                                 )
                                )
                               )
                              );
                              Set(gblSaving, false); Refresh(CN_勤怠明細台帳);
                              If(IsEmpty(colCalendarErrors),
                               Set(gblEmpID, First(S3_Workers.SelectedItems).EmployeeID); Set(gblMonth, Date(Year(gblSelDate), Month(gblSelDate), 1)); Set(gblReportFromCalendar, true); Set(gblReportSite, siteName); Set(gblReportPrime, company); Set(gblReportContact, Trim(S3_Contact.Text)); Set(gblReportContent, S3_Note.Text); Set(gblReportStart, s); Set(gblReportEnd, e); Navigate(S11_Report, ScreenTransition.None),
                               Notify("登録できなかった作業員：" & Concat(colCalendarErrors, workerName & "：" & message, " / "), NotificationType.Error)
                              )
                             )
                            )
                           )
                          )
                        Y: =1244
      - S3_NavBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(26, 58, 42, 1)
            Height: =70
            Width: =Parent.Width
            Y: =Parent.Height - 70
      - S3_Nav1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 204, 102, 0.3)
            OnSelect: =Navigate(S1_Home, ScreenTransition.None)
            PressedFill: =RGBA(0, 204, 102, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: ="ホーム"
            Width: =Parent.Width / 5
            X: =Parent.Width / 5 * 0
            Y: =Parent.Height - 70
      - S3_Nav2:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 204, 102, 0.3)
            OnSelect: =Navigate(S2_Calendar, ScreenTransition.None)
            PressedFill: =RGBA(0, 204, 102, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: ="カレンダー"
            Width: =Parent.Width / 5
            X: =Parent.Width / 5 * 1
            Y: =Parent.Height - 70
      - S3_Nav3:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(0, 204, 102, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 204, 102, 0.3)
            OnSelect: =Set(gblSelDate, Today()); Navigate(S3_Register, ScreenTransition.None)
            PressedFill: =RGBA(0, 204, 102, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: ="登録"
            Width: =Parent.Width / 5
            X: =Parent.Width / 5 * 2
            Y: =Parent.Height - 70
      - S3_Nav4:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 204, 102, 0.3)
            OnSelect: '=Navigate(S4_Summary, ScreenTransition.None) '
            PressedFill: =RGBA(0, 204, 102, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: ="集計"
            Width: =Parent.Width / 5
            X: =Parent.Width / 5 * 3
            Y: =Parent.Height - 70
      - S3_Nav5:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 204, 102, 0.3)
            OnSelect: '=Navigate(S7_Settings, ScreenTransition.None)    '
            PressedFill: =RGBA(0, 204, 102, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: ="設定"
            Width: =Parent.Width / 5
            X: =Parent.Width / 5 * 4
            Y: =Parent.Height - 70
