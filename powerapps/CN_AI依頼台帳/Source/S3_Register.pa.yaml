Screens:
  S3_Register:
    Properties:
      Fill: =RGBA(10, 10, 10, 1)
      OnVisible: |-
        =If(IsBlank(gblMonth), Set(gblMonth, Date(Year(Today()), Month(Today()), 1)));
        If(IsBlank(gblEmpID) || Lower(User().Email) <> "k.k.hisyoengineer@hisyoengineer.onmicrosoft.com", Set(gblEmpID, Trim(LookUp(CN_社員台帳, EntraObjectId = Text(User().EntraObjectId)).社員ID)));
        If(IsBlank(gblSelDate), Set(gblSelDate, Today()));
        If(IsBlank(gblEmpID), Notify("登録されていないアカウントです。書き込みはできません", NotificationType.Error));
        ClearCollect(colTorihiki, CN_取引先台帳)
    Children:
      - S3_Register_MobileScroll:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height - 70
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            Width: =Parent.Width
          Children:
            - S3_Register_MobileBody:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =Max(664, Parent.Height)
                  LayoutMinHeight: =Max(664, Parent.Height)
                  LayoutMinWidth: =0
                  Width: =Parent.Width
                Children:
                  - S3_Title:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(0, 204, 102, 1)
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        Size: =22
                        Text: ="出勤登録（" & If(gblCalType = "設備", "設備", "解体") & "）"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =16
                  - S3_Emp:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =26
                        Size: =12
                        Text: ="作業員：" & Coalesce(LookUp(CN_社員台帳, 社員ID = gblEmpID).氏名, "未選択")
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =60
                  - S3_DateCap:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(120, 120, 120, 1)
                        Height: =24
                        Size: =11
                        Text: ="日付"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =92
                  - S3_PrevDay:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =RGBA(0, 204, 102, 1)
                        Fill: =RGBA(26, 58, 42, 1)
                        Height: =44
                        OnSelect: =Set(gblSelDate, DateAdd(gblSelDate, -1, TimeUnit.Days))
                        Size: =16
                        Text: ="＜"
                        Width: =48
                        X: =16
                        Y: =116
                  - S3_Date:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(26, 58, 42, 1)
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        Size: =16
                        Text: '=Text(gblSelDate, "yyyy/m/d") & "（" & Left(Text(gblSelDate, "dddd"), 1) & "）"  '
                        Width: =Parent.Width - 136
                        X: =68
                        Y: =116
                  - S3_NextDay:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =RGBA(0, 204, 102, 1)
                        Fill: =RGBA(26, 58, 42, 1)
                        Height: =44
                        OnSelect: =Set(gblSelDate, DateAdd(gblSelDate, 1, TimeUnit.Days))
                        Size: =16
                        Text: ="＞"
                        Width: =48
                        X: =Parent.Width - 64
                        Y: =116
                  - S3_StatusCap:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(120, 120, 120, 1)
                        Height: =24
                        Size: =11
                        Text: ="勤務区分"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =168
                  - S3_Status:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        ChevronBackground: =RGBA(0, 204, 102, 1)
                        ChevronFill: =RGBA(10, 10, 10, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Default: ="日勤"
                        Fill: =RGBA(26, 58, 42, 1)
                        Height: =44
                        Items: =["日勤", "夜勤", "早出", "残業"]
                        Items.Value: =Value
                        SelectionFill: =RGBA(0, 204, 102, 1)
                        Size: =14
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =192
                  - S3_TimeCap:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(120, 120, 120, 1)
                        Height: =24
                        Size: =11
                        Text: ="開始 ／ 終了"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =244
                  - S3_Start:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        ChevronBackground: =RGBA(0, 204, 102, 1)
                        ChevronFill: =RGBA(10, 10, 10, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Default: ="08:00"
                        Fill: =RGBA(26, 58, 42, 1)
                        Height: =44
                        Items: =ForAll(Sequence(48, 0), Text(Time(0, Value * 30, 0), "hh:mm"))
                        Items.Value: =Value
                        SelectionFill: =RGBA(0, 204, 102, 1)
                        Size: =14
                        Width: =(Parent.Width - 40) / 2
                        X: =16
                        Y: =268
                  - S3_End:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        ChevronBackground: =RGBA(0, 204, 102, 1)
                        ChevronFill: =RGBA(10, 10, 10, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Default: ="17:00"
                        Fill: =RGBA(26, 58, 42, 1)
                        Height: =44
                        Items: =ForAll(Sequence(48, 0), Text(Time(0, Value * 30, 0), "hh:mm"))
                        Items.Value: =Value
                        SelectionFill: =RGBA(0, 204, 102, 1)
                        Size: =14
                        Width: =(Parent.Width - 40) / 2
                        X: =24 + (Parent.Width - 40) / 2
                        Y: =268
                  - S3_BreakCap:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(120, 120, 120, 1)
                        Height: =24
                        Size: =11
                        Text: ="休憩（分）"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =320
                  - S3_Break:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        ChevronBackground: =RGBA(0, 204, 102, 1)
                        ChevronFill: =RGBA(10, 10, 10, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Default: =60
                        Fill: =RGBA(26, 58, 42, 1)
                        Height: =44
                        Items: =[0, 30, 45, 60, 90]
                        Items.Value: =Value
                        SelectionFill: =RGBA(0, 204, 102, 1)
                        Size: =14
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =344
                  - S3_SiteCap:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(120, 120, 120, 1)
                        Height: =24
                        Size: =11
                        Text: ="現場"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: '=472 '
                  - S3_Site:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        ChevronBackground: =RGBA(0, 204, 102, 1)
                        ChevronFill: =RGBA(10, 10, 10, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Default: =gblPickSite
                        Fill: =RGBA(26, 58, 42, 1)
                        Height: =44
                        Items: =Sort(CN_現場台帳, 現場名).現場名
                        Items.Value: =Title
                        SelectionFill: =RGBA(0, 204, 102, 1)
                        Size: =14
                        Width: '=Parent.Width - 92   '
                        X: =16
                        Y: '=496 '
                  - S3_NoteCap:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(120, 120, 120, 1)
                        Height: =24
                        Size: =11
                        Text: ="メモ"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =624
                  - S3_Note:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Default: =""
                        Fill: =RGBA(26, 58, 42, 1)
                        Height: =44
                        HintText: ="任意"
                        Size: =14
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =648
                  - S3_Hours:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(0, 204, 102, 1)
                        Height: =30
                        Text: |-
                          =With({s: DateTimeValue(Text(gblSelDate, "yyyy-mm-dd") & " " & S3_Start.Selected.Value), e0: DateTimeValue(Text(gblSelDate, "yyyy-mm-dd") & " " & S3_End.Selected.Value)},
                              With({e: If(e0 <= s, DateAdd(e0, 1, TimeUnit.Days), e0)},
                                  With({m: DateDiff(s, e, TimeUnit.Minutes) - S3_Break.Selected.Value},
                                      "勤務時間：" & RoundDown(m / 60, 0) & "時間" & Mod(m, 60) & "分" & If(e0 <= s, "（翌日終了）", ""))))
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =700
                  - S3_Save:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =RGBA(10, 10, 10, 1)
                        DisabledFill: =RGBA(120, 120, 120, 1)
                        DisplayMode: =If(gblSaving, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =RGBA(0, 204, 102, 1)
                        FontWeight: =FontWeight.Bold
                        Height: =52
                        HoverFill: =RGBA(0, 230, 115, 1)
                        OnSelect: |-
                          =With({s: DateTimeValue(Text(gblSelDate, "yyyy-mm-dd") & " " & S3_Start.Selected.Value), e0: DateTimeValue(Text(gblSelDate, "yyyy-mm-dd") & " " & S3_End.Selected.Value), k: gblEmpID & "_" & Text(gblSelDate, "yyyymmdd")},
                              With({e: If(e0 <= s, DateAdd(e0, 1, TimeUnit.Days), e0)},
                                  If(
                                      IsBlank(gblEmpID), Notify("作業員が選択されていません", NotificationType.Error),
                                      IsBlank(S3_Site.Selected.現場名), Notify("現場を選択してください", NotificationType.Error),
                                      DateDiff(s, e, TimeUnit.Minutes) - S3_Break.Selected.Value <= 0, Notify("勤務時間が0分以下です。時刻と休憩を確認してください", NotificationType.Error),
                                      !IsBlank(LookUp(CN_勤怠明細台帳, 勤怠キー = k)), Notify("この日はすでに登録されています", NotificationType.Error),
                                      Set(gblSaving, true);
                                      IfError(
                                          Patch(CN_勤怠明細台帳, Defaults(CN_勤怠明細台帳), {
                                              勤怠明細名: "出勤_" & k,
                                              勤怠キー: k,
                                              日報キー: "未連携",
                                              社員レコードキー: gblEmpID,
                                              端末送信ID: GUID(),
                                              レコード状態: {Value: "Submitted"},
                                              開始日時: s,
                                              終了日時: e,
                                              休憩分: S3_Break.Selected.Value,
                                              勤務区分: {Value: S3_Status.Selected.Value},
                                              業種: {Value: If(gblCalType in ["設備", "請負", "運営"], gblCalType, "解体")},
                                              現場ID: LookUp(CN_現場台帳, 現場名 = S3_Site.Selected.現場名).現場ID,
                                              メモ: S3_Note.Text,
                                          元請会社: S3_Prime.Selected.取引先名,
                                          現場名: S3_Site.Selected.現場名,
                                          職種: S3_Job.Selected.職種名,
                                          原入力: JSON({siteName: S3_Site.Selected.現場名, primeCompany: S3_Prime.Selected.取引先名, jobType: S3_Job.Selected.職種名}, JSONFormat.Compact)
                                          });
                                          Set(gblSaving, false);
                                          Notify("登録しました", NotificationType.Success);
                                          Reset(S3_Note);
                                          Set(gblMonth, Date(Year(gblSelDate), Month(gblSelDate), 1));
                                          Navigate(S2_Calendar, ScreenTransition.None),
                                          Set(gblSaving, false);
                                          Notify("保存に失敗しました：" & FirstError.Message, NotificationType.Error)
                                      )
                                  )))
                        PressedFill: =RGBA(0, 160, 80, 1)
                        Size: =16
                        Text: ="登録する"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =738
                  - S3_PrimeCap:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(120, 120, 120, 1)
                        Height: =24
                        Size: =11
                        Text: ="元請企業"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =396
                  - S3_Prime:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        AllowEmptySelection: =true
                        BorderColor: =RGBA(0, 204, 102, 1)
                        ChevronBackground: =RGBA(0, 204, 102, 1)
                        ChevronFill: =RGBA(10, 10, 10, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Default: =gblPickPrime
                        Fill: =RGBA(26, 58, 42, 1)
                        Height: =44
                        Items: =Sort(Filter(colTorihiki, CountIf(取引先区分, Value = "元請") > 0), 取引先名, SortOrder.Ascending).取引先名
                        Items.Value: =Title
                        SelectionFill: =RGBA(0, 204, 102, 1)
                        Size: =14
                        Width: =Parent.Width - 92
                        X: =16
                        Y: =420
                  - S3_PrimeAdd:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(10, 10, 10, 1)
                        Fill: =RGBA(0, 204, 102, 1)
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        OnSelect: =Set(gblNewMode, "元請企業"); Reset(S3_NewName)
                        Size: =14
                        Text: ="＋新規"
                        Width: =68
                        X: =Parent.Width - 84
                        Y: =420
                  - S3_SiteAdd:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(10, 10, 10, 1)
                        Fill: =RGBA(0, 204, 102, 1)
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        OnSelect: =Set(gblNewMode, "現場"); Reset(S3_NewName)
                        Size: =14
                        Text: ="＋新規"
                        Width: =68
                        X: =Parent.Width - 84
                        Y: =496
                  - S3_JobCap:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(120, 120, 120, 1)
                        Height: =24
                        Size: =11
                        Text: ="職種"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =548
                  - S3_Job:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        AllowEmptySelection: =true
                        BorderColor: =RGBA(0, 204, 102, 1)
                        ChevronBackground: =RGBA(0, 204, 102, 1)
                        ChevronFill: =RGBA(10, 10, 10, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Default: =gblPickJob
                        Fill: =RGBA(26, 58, 42, 1)
                        Height: =44
                        Items: =Sort(CN_職種マスタ, 職種名).職種名
                        Items.Value: =Title
                        SelectionFill: =RGBA(0, 204, 102, 1)
                        Size: =14
                        Width: =Parent.Width - 92
                        X: =16
                        Y: =572
                  - S3_JobAdd:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(10, 10, 10, 1)
                        Fill: =RGBA(0, 204, 102, 1)
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        OnSelect: =Set(gblNewMode, "職種"); Reset(S3_NewName)
                        Size: =14
                        Text: ="＋新規"
                        Width: =68
                        X: =Parent.Width - 84
                        Y: =572
                  - S3_NewBg:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(0, 0, 0, 0.75)
                        Height: =1000
                        Visible: =!IsBlank(gblNewMode)
                        Width: =Parent.Width
                  - S3_NewPanel:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        BorderThickness: =2
                        Fill: =RGBA(26, 58, 42, 1)
                        Height: =250
                        Visible: =!IsBlank(gblNewMode)
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =300
                  - S3_NewTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(0, 204, 102, 1)
                        FontWeight: =FontWeight.Bold
                        Height: =36
                        Size: =16
                        Text: =gblNewMode & " を新規登録"
                        Visible: =!IsBlank(gblNewMode)
                        Width: =Parent.Width - 64
                        X: =32
                        Y: =316
                  - S3_NewHint:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(200, 200, 200, 1)
                        Height: =28
                        Size: =11
                        Text: =If(gblNewMode = "現場", "元請企業：" & Coalesce(S3_Prime.Selected.取引先名, "（未選択）"), "")
                        Visible: =!IsBlank(gblNewMode)
                        Width: =Parent.Width - 64
                        X: =32
                        Y: =352
                  - S3_NewName:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Default: =""
                        Fill: =RGBA(10, 10, 10, 1)
                        Height: =44
                        HintText: =gblNewMode & "名を入力"
                        Size: =14
                        Visible: =!IsBlank(gblNewMode)
                        Width: =Parent.Width - 64
                        X: =32
                        Y: =384
                  - S3_NewOK:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(10, 10, 10, 1)
                        Fill: =RGBA(0, 204, 102, 1)
                        FontWeight: =FontWeight.Bold
                        Height: =48
                        OnSelect: |-
                          =With({n: Trim(S3_NewName.Text), ts: Text(Now(), "yyyymmddhhmmss")},
                            If(IsBlank(n), Notify("名前を入力してください", NotificationType.Error),
                              Switch(gblNewMode,
                                "元請企業",
                                  If(!IsBlank(LookUp(CN_取引先台帳, 取引先名 = n)), Notify("同じ名前の取引先が既にあります", NotificationType.Warning),
                                    IfError(
                                      Patch(CN_取引先台帳, Defaults(CN_取引先台帳), {取引先名: n, 取引先キー: "PRM_" & ts, 取引先区分: Table({Value: "元請"}), 有効: true, レコード状態: {Value: "Confirmed"}});
                                      ClearCollect(colTorihiki, CN_取引先台帳); Set(gblPickPrime, n); Set(gblNewMode, ""); Notify("元請企業を登録しました", NotificationType.Success),
                                      Notify("登録に失敗しました：" & FirstError.Message, NotificationType.Error))),
                                "現場",
                                  If(!IsBlank(LookUp(CN_現場台帳, 現場名 = n)), Notify("同じ名前の現場が既にあります", NotificationType.Warning),
                                    IfError(
                                      Patch(CN_現場台帳, Defaults(CN_現場台帳), {現場名: n, 現場ID: "SITE_" & ts, 元請会社: S3_Prime.Selected.取引先名});
                                      Set(gblPickSite, n); Set(gblNewMode, ""); Notify("現場を登録しました", NotificationType.Success),
                                      Notify("登録に失敗しました：" & FirstError.Message, NotificationType.Error))),
                                "職種",
                                  If(!IsBlank(LookUp(CN_職種マスタ, 職種名 = n)), Notify("同じ職種が既にあります", NotificationType.Warning),
                                    IfError(
                                      Patch(CN_職種マスタ, Defaults(CN_職種マスタ), {職種名: n});
                                      Set(gblPickJob, n); Set(gblNewMode, ""); Notify("職種を登録しました", NotificationType.Success),
                                      Notify("登録に失敗しました：" & FirstError.Message, NotificationType.Error)))
                              )
                            )
                          )
                        Size: =14
                        Text: ="登録"
                        Visible: =!IsBlank(gblNewMode)
                        Width: =(Parent.Width - 72) / 2
                        X: =32
                        Y: =448
                  - S3_NewCancel:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        BorderThickness: =1
                        Color: =RGBA(0, 204, 102, 1)
                        Fill: =RGBA(10, 10, 10, 1)
                        Height: =48
                        OnSelect: =Set(gblNewMode, "")
                        Size: =14
                        Text: ="キャンセル"
                        Visible: =!IsBlank(gblNewMode)
                        Width: =(Parent.Width - 72) / 2
                        X: =Parent.Width / 2 + 4
                        Y: =448
      - S3_NavBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(26, 58, 42, 1)
            Height: =70
            Width: =Parent.Width
            Y: =Parent.Height - 70
      - S3_Nav1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 204, 102, 0.3)
            OnSelect: =Navigate(S1_Home, ScreenTransition.None)
            PressedFill: =RGBA(0, 204, 102, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: ="ホーム"
            Width: =Parent.Width / 5
            X: =Parent.Width / 5 * 0
            Y: =Parent.Height - 70
      - S3_Nav2:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 204, 102, 0.3)
            OnSelect: =Navigate(S2_Calendar, ScreenTransition.None)
            PressedFill: =RGBA(0, 204, 102, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: ="カレンダー"
            Width: =Parent.Width / 5
            X: =Parent.Width / 5 * 1
            Y: =Parent.Height - 70
      - S3_Nav3:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(0, 204, 102, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 204, 102, 0.3)
            OnSelect: =Set(gblSelDate, Today()); Navigate(S3_Register, ScreenTransition.None)
            PressedFill: =RGBA(0, 204, 102, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
