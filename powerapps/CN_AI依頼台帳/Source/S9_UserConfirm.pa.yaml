Screens:
  S9_UserConfirm:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
    Children:
      - Label1:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =2
            Color: =RGBA(50, 49, 48, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            FocusedBorderThickness: =4
            Font: =Font.'Segoe UI'
            Height: |+
              =Parent.Height - 160

            Size: |+
              =18

            Text: |-
              ="登録内容の確認" & Char(10) & "氏名: " & Form3.Updates.Title & Char(10) & "フリガナ: " & Form3.Updates.Furigana & Char(10) & "メール: " & Form3.Updates.Email & Char(10) & "携帯: " & Form3.Updates.MobilePhone & Char(10) & "住所: " & Form3.Updates.Address & Char(10) & "緊急連絡先: " & Form3.Updates.EmergencyName
            VerticalAlign: |+
              =VerticalAlign.Top
            Width: |+
              =Parent.Width - 40
            X: =20
            Y: |+
              =30
      - Button7:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =RGBA(0, 120, 212, 1)
            Font: =Font.'Segoe UI'
            Height: =56
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(16, 110, 190, 1)
            OnSelect: =If(IsBlank(LookUp(CN_本人マイデータ, UserUPN = Lower(User().Email))), SubmitForm(Form3), Notify("登録済みのアカウントです", NotificationType.Error))
            PressedBorderColor: =RGBA(0, 69, 120, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(16, 110, 190, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: |+
              =18
            Text: ="内容を確認して登録"
            Width: =Parent.Width - 40
            X: =20
            Y: =Parent.Height - 100
