Screens:
  S2_Calendar:
    Properties:
      Fill: =RGBA(10, 10, 10, 1)
      OnVisible: =Set(gblOpsAuthorized, false); Clear(colOps); Clear(colAttend); If(gblCalType = "運営", Set(gblCalType, "解体")); If(IsBlank(gblCalType), Set(gblCalType, "解体")); If(IsBlank(gblMonth), Set(gblMonth, Date(Year(Today()), Month(Today()), 1))); If(IsBlank(gblEmpID), Clear(colAttend), If(gblIdentityVerified && !IsBlank(gblEmpID) && !IsBlank(User().EntraObjectId) && Trim(Coalesce(gblCurrentEmployee.EmployeeID, "")) = gblEmpID && Lower(Trim(Coalesce(gblCurrentEmployee.EntraObjectId, ""))) = Lower(Text(User().EntraObjectId)), ClearCollect(colAttend, Filter(CN_勤怠明細台帳, 社員レコードキー = gblEmpID, 業種.Value = gblCalType, 開始日時 >= gblMonth, 開始日時 < DateAdd(gblMonth, 1, TimeUnit.Months))), Clear(colAttend))); Clear(colOps)
    Children:
      - S2_Calendar_MobileScroll:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height - If(gblCalType = "設備", 130, If(gblCalType = "運営", 330, 70))
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            Width: =Parent.Width
          Children:
            - S2_Calendar_MobileBody:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =Max(640, Parent.Height, S2_Grid.Y + S2_Grid.Height + 160)
                  LayoutMinHeight: =Max(640, Parent.Height, S2_Grid.Y + S2_Grid.Height + 160)
                  LayoutMinWidth: =0
                  Width: =Parent.Width
                Children:
                  - S2_Title:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(0, 204, 102, 1)
                        FontWeight: =FontWeight.Bold
                        Height: =50
                        Size: =20
                        Text: =Text(gblMonth, "yyyy年m月")
                        Width: =Parent.Width - 140
                        X: =70
                        Y: =16
                  - S2_Prev:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =RGBA(0, 204, 102, 1)
                        Fill: =RGBA(26, 58, 42, 1)
                        Height: =50
                        OnSelect: |-
                          =Set(gblMonth, DateAdd(gblMonth, -1, TimeUnit.Months));
                          If(gblIdentityVerified && !IsBlank(gblEmpID) && !IsBlank(User().EntraObjectId) && Trim(Coalesce(gblCurrentEmployee.EmployeeID, "")) = gblEmpID && Lower(Trim(Coalesce(gblCurrentEmployee.EntraObjectId, ""))) = Lower(Text(User().EntraObjectId)), ClearCollect(colAttend, Filter(CN_勤怠明細台帳, 社員レコードキー = gblEmpID, 業種.Value = gblCalType, 開始日時 >= gblMonth, 開始日時 < DateAdd(gblMonth, 1, TimeUnit.Months))), Clear(colAttend)); Clear(colOps)
                        Size: =18
                        Text: ="＜"
                        Width: =50
                        X: =16
                        Y: =16
                  - S2_Next:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =RGBA(0, 204, 102, 1)
                        Fill: =RGBA(26, 58, 42, 1)
                        Height: =50
                        OnSelect: |-
                          =Set(gblMonth, DateAdd(gblMonth, 1, TimeUnit.Months));
                          If(gblIdentityVerified && !IsBlank(gblEmpID) && !IsBlank(User().EntraObjectId) && Trim(Coalesce(gblCurrentEmployee.EmployeeID, "")) = gblEmpID && Lower(Trim(Coalesce(gblCurrentEmployee.EntraObjectId, ""))) = Lower(Text(User().EntraObjectId)), ClearCollect(colAttend, Filter(CN_勤怠明細台帳, 社員レコードキー = gblEmpID, 業種.Value = gblCalType, 開始日時 >= gblMonth, 開始日時 < DateAdd(gblMonth, 1, TimeUnit.Months))), Clear(colAttend)); Clear(colOps)
                        Size: =18
                        Text: ="＞"
                        Width: =50
                        X: =Parent.Width - 66
                        Y: =16
                  - S2_Emp:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(120, 120, 120, 1)
                        Height: =28
                        Size: =12
                        Text: =If(gblCalType = "運営", "運営カレンダー：全作業員の合計（解体＋設備）", gblCalType & "カレンダー　作業員：" & Coalesce(LookUp(CN_社員台帳, 社員ID = gblEmpID).氏名, "未選択"))
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =72
                  - S2_WeekHead:
                      Control: Gallery@2.15.0
                      Variant: Horizontal
                      Properties:
                        Height: =30
                        Items: =["日", "月", "火", "水", "木", "金", "土"]
                        ShowScrollbar: =false
                        TemplatePadding: =0
                        TemplateSize: =(Parent.Width - 32) / 7
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =164
                      Children:
                        - S2_WeekLbl:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =Switch(ThisItem.Value, "日", RGBA(255, 51, 51, 1), "土", RGBA(0, 102, 255, 1), RGBA(255, 255, 255, 1))
                              FontWeight: =FontWeight.Bold
                              Height: =Parent.TemplateHeight
                              Size: =12
                              Text: =ThisItem.Value
                              Width: =Parent.TemplateWidth
                  - S2_Grid:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        Height: =Max(44, (Parent.Width - 32) / 7) * 6 + 12
                        Items: |-
                          =ForAll(Sequence(42, 0), {d: DateAdd(gblMonth, Value - Weekday(gblMonth) + 1, TimeUnit.Days)})
                        OnSelect: |-
                          =If(gblCalType = "運営", Clear(colOps); Set(gblCalType, "解体"); Notify("運営情報は権限確認中のため表示できません", NotificationType.Warning), Set(gblSelDate, ThisItem.d); Navigate(S3_Register, ScreenTransition.None))
                        ShowScrollbar: =false
                        TemplatePadding: =2
                        TemplateSize: =Max(44, (Parent.Width - 32) / 7)
                        Width: =Parent.Width - 32
                        WrapCount: =7
                        X: =16
                        Y: =198
                      Children:
                        - S2_Cell:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: |-
                                =If(Text(ThisItem.d, "yyyymmdd") = Text(Today(), "yyyymmdd"), RGBA(0, 204, 102, 0.35),
                                    Month(ThisItem.d) <> Month(gblMonth), RGBA(20, 20, 20, 1), RGBA(26, 58, 42, 1))
                              Height: =Parent.TemplateHeight
                              OnSelect: '=Select(Parent)  '
                              Width: =Parent.TemplateWidth
                        - S2_DayNum:
                            Control: Label@2.5.1
                            Properties:
                              Color: |-
                                =If(Month(ThisItem.d) <> Month(gblMonth), RGBA(120, 120, 120, 1),
                                    Weekday(ThisItem.d) = 1, RGBA(255, 51, 51, 1),
                                    Weekday(ThisItem.d) = 7, RGBA(0, 102, 255, 1), RGBA(255, 255, 255, 1))
                              Height: =22
                              OnSelect: '=Select(Parent)  '
                              Size: =11
                              Text: =Day(ThisItem.d)
                              Width: =Parent.TemplateWidth - 8
                              X: =1
                              Y: =2
                        - S2_Status:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(10, 10, 10, 1)
                              Fill: =If(IsBlank(Self.Text), RGBA(0, 0, 0, 0), RGBA(0, 204, 102, 1))
                              FontWeight: =FontWeight.Bold
                              Height: =22
                              OnSelect: '=Select(Parent)  '
                              Size: =10
                              Text: |-
                                =If(gblCalType = "運営", "", LookUp(colAttend, Text(開始日時, "yyyymmdd") = Text(ThisItem.d, "yyyymmdd")).勤務区分.Value)
                              Width: =Parent.TemplateWidth
                              Y: =Parent.TemplateHeight - 26
                  - S2_Sum:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(0, 204, 102, 1)
                        FontWeight: =FontWeight.Bold
                        Height: =130
                        Size: =13
                        Text: |-
                          =If(gblCalType = "運営", "",
                          
                          
                          
                          
                          
                          "今月の出勤（" & gblCalType & "）：" & CountRows(Distinct(colAttend, Text(開始日時, "yyyymmdd"))) & " 日")
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =S2_Grid.Y + S2_Grid.Height + 16
                  - S2_Type0:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        BorderThickness: =1
                        Color: =If(gblCalType = "解体", RGBA(10, 10, 10, 1), RGBA(0, 204, 102, 1))
                        Fill: =If(gblCalType = "解体", RGBA(0, 204, 102, 1), RGBA(26, 58, 42, 1))
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        OnSelect: =Set(gblCalType, "解体"); If(gblIdentityVerified && !IsBlank(gblEmpID) && !IsBlank(User().EntraObjectId) && Trim(Coalesce(gblCurrentEmployee.EmployeeID, "")) = gblEmpID && Lower(Trim(Coalesce(gblCurrentEmployee.EntraObjectId, ""))) = Lower(Text(User().EntraObjectId)), ClearCollect(colAttend, Filter(CN_勤怠明細台帳, 社員レコードキー = gblEmpID, 業種.Value = gblCalType, 開始日時 >= gblMonth, 開始日時 < DateAdd(gblMonth, 1, TimeUnit.Months))), Clear(colAttend)); Clear(colOps)
                        Size: =13
                        Text: ="解体"
                        Width: =(Parent.Width - 48) / 3
                        X: =16 + 0 * ((Parent.Width - 48) / 3 + 8)
                        Y: =108
                  - S2_Type1:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        BorderThickness: =1
                        Color: =If(gblCalType = "設備", RGBA(10, 10, 10, 1), RGBA(0, 204, 102, 1))
                        Fill: =If(gblCalType = "設備", RGBA(0, 204, 102, 1), RGBA(26, 58, 42, 1))
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        OnSelect: =Set(gblCalType, "設備"); If(gblIdentityVerified && !IsBlank(gblEmpID) && !IsBlank(User().EntraObjectId) && Trim(Coalesce(gblCurrentEmployee.EmployeeID, "")) = gblEmpID && Lower(Trim(Coalesce(gblCurrentEmployee.EntraObjectId, ""))) = Lower(Text(User().EntraObjectId)), ClearCollect(colAttend, Filter(CN_勤怠明細台帳, 社員レコードキー = gblEmpID, 業種.Value = gblCalType, 開始日時 >= gblMonth, 開始日時 < DateAdd(gblMonth, 1, TimeUnit.Months))), Clear(colAttend)); Clear(colOps)
                        Size: =13
                        Text: ="設備"
                        Width: =(Parent.Width - 48) / 3
                        X: =16 + 1 * ((Parent.Width - 48) / 3 + 8)
                        Y: =108
                  - S2_Type2:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        BorderThickness: =1
                        Color: =If(gblCalType = "運営", RGBA(10, 10, 10, 1), RGBA(0, 204, 102, 1))
                        Fill: =If(gblCalType = "運営", RGBA(0, 204, 102, 1), RGBA(26, 58, 42, 1))
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        OnSelect: =Clear(colOps); Set(gblOpsAuthorized, false); Set(gblCalType, "解体"); Notify("運営権限を確認できません", NotificationType.Warning)
                        Size: =13
                        Text: ="運営"
                        Visible: =false
                        Width: =(Parent.Width - 48) / 3
                        X: =16 + 2 * ((Parent.Width - 48) / 3 + 8)
                        Y: =108
      - S2_OpsDate:
          Control: Classic/DatePicker@2.6.0
          Properties:
            BorderColor: =RGBA(0, 204, 102, 1)
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(26, 58, 42, 1)
            Height: =40
            Size: =14
            Width: =(Parent.Width - 40) / 2
            X: =16
            Y: =Parent.Height - 330
            DefaultDate: =Today()
            Format: ="yyyy/mm/dd"
            Visible: =false
      - S2_OpsSite:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 204, 102, 1)
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(26, 58, 42, 1)
            Height: =40
            Size: =14
            Width: =(Parent.Width - 40) / 2
            X: =24 + (Parent.Width - 40) / 2
            Y: =Parent.Height - 330
            Default: =""
            HintText: ="現場名"
            Visible: =false
      - S2_OpsSales:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 204, 102, 1)
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(26, 58, 42, 1)
            Height: =40
            Size: =14
            Width: =(Parent.Width - 40) / 2
            X: =16
            Y: =Parent.Height - 282
            Default: =""
            HintText: ="売上（円）"
            Visible: =false
      - S2_OpsExp:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 204, 102, 1)
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(26, 58, 42, 1)
            Height: =40
            Size: =14
            Width: =(Parent.Width - 40) / 2
            X: =24 + (Parent.Width - 40) / 2
            Y: =Parent.Height - 282
            Default: =""
            HintText: ="経費（円）"
            Visible: =false
      - S2_OpsSave:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 204, 102, 1)
            Color: =RGBA(10, 10, 10, 1)
            Fill: =RGBA(0, 204, 102, 1)
            Height: =48
            Size: =16
            Width: =(Parent.Width - 40) / 2
            X: =16
            Y: =Parent.Height - 232
            Text: ="保存"
            Visible: =false
            OnSelect: |-
              =Notify("運営カレンダーへの保存は権限確認完了まで停止しています", NotificationType.Error)
              
              
              
      - S2_OpsCancel:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 204, 102, 1)
            Color: =RGBA(0, 204, 102, 1)
            Fill: =RGBA(26, 58, 42, 1)
            Height: =48
            Size: =16
            Width: =(Parent.Width - 40) / 2
            X: =24 + (Parent.Width - 40) / 2
            Y: =Parent.Height - 232
            Text: ="取消"
            Visible: =false
            OnSelect: =Reset(S2_OpsDate); Reset(S2_OpsSite); Reset(S2_OpsSales); Reset(S2_OpsExp)
      - S2_NavBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(26, 58, 42, 1)
            Height: =70
            Width: =Parent.Width
            Y: =Parent.Height - 70
      - S2_Nav1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 204, 102, 0.3)
            OnSelect: =Navigate(S1_Home, ScreenTransition.None)
            PressedFill: =RGBA(0, 204, 102, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: ="ホーム"
            Width: =Parent.Width / 5
            X: =Parent.Width / 5 * 0
            Y: =Parent.Height - 70
      - S2_Nav2:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(0, 204, 102, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 204, 102, 0.3)
            OnSelect: =Navigate(S2_Calendar, ScreenTransition.None)
            PressedFill: =RGBA(0, 204, 102, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: ="カレンダー"
            Width: =Parent.Width / 5
            X: =Parent.Width / 5 * 1
            Y: =Parent.Height - 70
      - S2_Nav3:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 204, 102, 0.3)
            OnSelect: =Set(gblSelDate, Today()); Navigate(S3_Register, ScreenTransition.None)
            PressedFill: =RGBA(0, 204, 102, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: ="登録"
            Width: =Parent.Width / 5
            X: =Parent.Width / 5 * 2
            Y: =Parent.Height - 70
      - S2_Nav4:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 204, 102, 0.3)
            OnSelect: '=Navigate(S4_Summary, ScreenTransition.None) '
            PressedFill: =RGBA(0, 204, 102, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: ="集計"
            Width: =Parent.Width / 5
            X: =Parent.Width / 5 * 3
            Y: =Parent.Height - 70
      - S2_Nav5:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 204, 102, 0.3)
            OnSelect: '=Navigate(S7_Settings, ScreenTransition.None)    '
            PressedFill: =RGBA(0, 204, 102, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: ="設定"
            Width: =Parent.Width / 5
            X: =Parent.Width / 5 * 4
            Y: =Parent.Height - 70
