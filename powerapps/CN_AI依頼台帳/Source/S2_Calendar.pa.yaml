Screens:
  S2_Calendar:
    Properties:
      Fill: =RGBA(10, 10, 10, 1)
      OnVisible: =If(IsBlank(gblCalType), Set(gblCalType, "解体")); If(IsBlank(gblMonth), Set(gblMonth, Date(Year(Today()), Month(Today()), 1))); If(IsBlank(gblEmpID), Clear(colAttend), ClearCollect(colAttend, Filter(CN_勤怠明細台帳, 社員レコードキー = gblEmpID, 業種.Value = gblCalType, 開始日時 >= gblMonth, 開始日時 < DateAdd(gblMonth, 1, TimeUnit.Months)))); If(gblCalType = "運営", ClearCollect(colOps, Filter(CN_勤怠明細台帳, 開始日時 >= gblMonth, 開始日時 < DateAdd(gblMonth, 1, TimeUnit.Months))))
    Children:
      - S2_Calendar_MobileScroll:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height - If(gblCalType = "設備", 130, 70)
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            Width: =Parent.Width
          Children:
            - S2_Calendar_MobileBody:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =Max(1350, Parent.Height, カレンダー日にち.Y + カレンダー日にち.Height + 128)
                  LayoutMinHeight: =Max(1350, Parent.Height, カレンダー日にち.Y + カレンダー日にち.Height + 128)
                  LayoutMinWidth: =0
                  Width: =Parent.Width
                Children:
                  - S2_Title:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(0, 204, 102, 1)
                        FontWeight: =FontWeight.Bold
                        Height: =50
                        Size: =20
                        Text: =Text(gblMonth, "yyyy年m月")
                        Width: =Parent.Width - 140
                        X: =70
                        Y: =16
                  - S2_Prev:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =RGBA(0, 204, 102, 1)
                        Fill: =RGBA(26, 58, 42, 1)
                        Height: =50
                        OnSelect: |-
                          =Set(gblMonth, DateAdd(gblMonth, -1, TimeUnit.Months));
                          ClearCollect(colAttend, Filter(CN_勤怠明細台帳, 社員レコードキー = gblEmpID, 業種.Value = gblCalType, 開始日時 >= gblMonth, 開始日時 < DateAdd(gblMonth, 1, TimeUnit.Months))); If(gblCalType = "運営", ClearCollect(colOps, Filter(CN_勤怠明細台帳, 開始日時 >= gblMonth, 開始日時 < DateAdd(gblMonth, 1, TimeUnit.Months))))
                        Size: =18
                        Text: ="＜"
                        Width: =50
                        X: =16
                        Y: =16
                  - S2_Next:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =RGBA(0, 204, 102, 1)
                        Fill: =RGBA(26, 58, 42, 1)
                        Height: =50
                        OnSelect: |-
                          =Set(gblMonth, DateAdd(gblMonth, 1, TimeUnit.Months));
                          ClearCollect(colAttend, Filter(CN_勤怠明細台帳, 社員レコードキー = gblEmpID, 業種.Value = gblCalType, 開始日時 >= gblMonth, 開始日時 < DateAdd(gblMonth, 1, TimeUnit.Months))); If(gblCalType = "運営", ClearCollect(colOps, Filter(CN_勤怠明細台帳, 開始日時 >= gblMonth, 開始日時 < DateAdd(gblMonth, 1, TimeUnit.Months))))
                        Size: =18
                        Text: ="＞"
                        Width: =50
                        X: =Parent.Width - 66
                        Y: =16
                  - S2_Emp:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(120, 120, 120, 1)
                        Height: =28
                        Size: =12
                        Text: =If(gblCalType = "運営", "運営カレンダー：全作業員の合計（解体＋設備）", gblCalType & "カレンダー　作業員：" & Coalesce(LookUp(CN_社員台帳, 社員ID = gblEmpID).氏名, "未選択"))
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =72
                  - 曜日:
                      Control: Gallery@2.15.0
                      Variant: Horizontal
                      Properties:
                        Height: =30
                        Items: =["日", "月", "火", "水", "木", "金", "土"]
                        ShowScrollbar: =false
                        TemplatePadding: =0
                        TemplateSize: =(Parent.Width - 32) / 7
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =164
                      Children:
                        - S2_WeekLbl:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =Switch(ThisItem.Value, "日", RGBA(255, 51, 51, 1), "土", RGBA(0, 102, 255, 1), RGBA(255, 255, 255, 1))
                              FontWeight: =FontWeight.Bold
                              Height: =Parent.TemplateHeight
                              Size: =12
                              Text: =ThisItem.Value
                              Width: =Parent.TemplateWidth
                  - カレンダー日にち:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        Height: =Max(44, (Parent.Width - 32) / 7) * 6 + 12
                        Items: |-
                          =ForAll(Sequence(42, 0), {d: DateAdd(gblMonth, Value - Weekday(gblMonth) + 1, TimeUnit.Days)})
                        OnSelect: |-
                          =If(gblCalType = "運営", With({f: Filter(colOps, Text(開始日時, "yyyymmdd") = Text(ThisItem.d, "yyyymmdd"))}, Notify(Text(ThisItem.d, "m/d") & "　稼働 " & CountRows(f) & "名（解体 " & CountRows(Filter(f, 業種.Value = "解体")) & "・設備 " & CountRows(Filter(f, 業種.Value = "設備")) & "）　早出 " & CountRows(Filter(f, 勤務区分.Value = "早出")) & "件　残業 " & CountRows(Filter(f, 勤務区分.Value = "残業")) & "件", NotificationType.Information)), Set(gblSelDate, ThisItem.d); Navigate(S3_Register, ScreenTransition.None))
                        ShowScrollbar: =false
                        TemplatePadding: =2
                        TemplateSize: =Max(44, (Parent.Width - 32) / 7)
                        Width: =Parent.Width - 32
                        WrapCount: =7
                        X: =16
                        Y: =198
                      Children:
                        - S2_Cell:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: |-
                                =If(Text(ThisItem.d, "yyyymmdd") = Text(Today(), "yyyymmdd"), RGBA(0, 204, 102, 0.35),
                                    Month(ThisItem.d) <> Month(gblMonth), RGBA(20, 20, 20, 1), RGBA(26, 58, 42, 1))
                              Height: =Parent.TemplateHeight
                              OnSelect: '=Select(Parent)  '
                              Width: =Parent.TemplateWidth
                        - S2_DayNum:
                            Control: Label@2.5.1
                            Properties:
                              Color: |-
                                =If(Month(ThisItem.d) <> Month(gblMonth), RGBA(120, 120, 120, 1),
                                    Weekday(ThisItem.d) = 1, RGBA(255, 51, 51, 1),
                                    Weekday(ThisItem.d) = 7, RGBA(0, 102, 255, 1), RGBA(255, 255, 255, 1))
                              Height: =22
                              OnSelect: '=Select(Parent)  '
                              Size: =11
                              Text: =Day(ThisItem.d)
                              Width: =Parent.TemplateWidth - 8
                              X: =1
                              Y: =2
                        - S2_Status:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(10, 10, 10, 1)
                              Fill: =If(IsBlank(Self.Text), RGBA(0, 0, 0, 0), RGBA(0, 204, 102, 1))
                              FontWeight: =FontWeight.Bold
                              Height: =22
                              OnSelect: '=Select(Parent)  '
                              Size: =10
                              Text: |-
                                =If(gblCalType = "運営", With({n: CountRows(Filter(colOps, Text(開始日時, "yyyymmdd") = Text(ThisItem.d, "yyyymmdd")))}, If(n > 0, "稼働 " & n & "名", "")), LookUp(colAttend, Text(開始日時, "yyyymmdd") = Text(ThisItem.d, "yyyymmdd")).勤務区分.Value)
                              Width: =Parent.TemplateWidth
                              Y: =Parent.TemplateHeight - 26
                  - 集計　売上:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(0, 204, 102, 1)
                        FontWeight: =FontWeight.Bold
                        Height: =373
                        Size: =14
                        Text: =If(gblCalType = "運営", "今月 延べ稼働 " & CountRows(colOps) & " 人日　早出 " & CountRows(Filter(colOps, 勤務区分.Value = "早出")) & " 件　残業 " & CountRows(Filter(colOps, 勤務区分.Value = "残業")) & " 件　売上・経費：未連携", "今月の出勤（" & gblCalType & "）：" & CountRows(Distinct(colAttend, Text(開始日時, "yyyymmdd"))) & " 日")
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =909
                  - 解体カレンダー:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        BorderThickness: =1
                        Color: =If(gblCalType = "解体", RGBA(10, 10, 10, 1), RGBA(0, 204, 102, 1))
                        Fill: =If(gblCalType = "解体", RGBA(0, 204, 102, 1), RGBA(26, 58, 42, 1))
                        FontWeight: =FontWeight.Bold
                        Height: =47
                        OnSelect: =Set(gblCalType, "解体"); ClearCollect(colAttend, Filter(CN_勤怠明細台帳, 社員レコードキー = gblEmpID, 業種.Value = gblCalType, 開始日時 >= gblMonth, 開始日時 < DateAdd(gblMonth, 1, TimeUnit.Months))); If(gblCalType = "運営", ClearCollect(colOps, Filter(CN_勤怠明細台帳, 開始日時 >= gblMonth, 開始日時 < DateAdd(gblMonth, 1, TimeUnit.Months))))
                        Size: =13
                        Text: ="解体"
                        Width: =Parent.Width / 4 - 14
                        X: =16 + 0 * ((Parent.Width - 48) / 3 + 8)
                        Y: =105
                  - 設備カレンダー:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        BorderThickness: =1
                        Color: =If(gblCalType = "設備", RGBA(10, 10, 10, 1), RGBA(0, 204, 102, 1))
                        Fill: =If(gblCalType = "設備", RGBA(0, 204, 102, 1), RGBA(26, 58, 42, 1))
                        FontWeight: =FontWeight.Bold
                        Height: =47
                        OnSelect: =Set(gblCalType, "設備"); ClearCollect(colAttend, Filter(CN_勤怠明細台帳, 社員レコードキー = gblEmpID, 業種.Value = gblCalType, 開始日時 >= gblMonth, 開始日時 < DateAdd(gblMonth, 1, TimeUnit.Months))); If(gblCalType = "運営", ClearCollect(colOps, Filter(CN_勤怠明細台帳, 開始日時 >= gblMonth, 開始日時 < DateAdd(gblMonth, 1, TimeUnit.Months))))
                        Size: =13
                        Text: ="設備"
                        Width: =Parent.Width / 4 - 14
                        X: =Parent.Width / 4 + 10
                        Y: =105
                  - 運営カレンダー:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        BorderThickness: =1
                        Color: =If(gblCalType = "運営", RGBA(10, 10, 10, 1), RGBA(0, 204, 102, 1))
                        Fill: =If(gblCalType = "運営", RGBA(0, 204, 102, 1), RGBA(26, 58, 42, 1))
                        FontWeight: =FontWeight.Bold
                        Height: =47
                        OnSelect: =Set(gblCalType, "運営"); ClearCollect(colAttend, Filter(CN_勤怠明細台帳, 社員レコードキー = gblEmpID, 業種.Value = gblCalType, 開始日時 >= gblMonth, 開始日時 < DateAdd(gblMonth, 1, TimeUnit.Months))); If(gblCalType = "運営", ClearCollect(colOps, Filter(CN_勤怠明細台帳, 開始日時 >= gblMonth, 開始日時 < DateAdd(gblMonth, 1, TimeUnit.Months))))
                        Size: =13
                        Text: ="運営"
                        Visible: =Lower(User().Email) = "k.k.hisyoengineer@hisyoengineer.onmicrosoft.com"
                        Width: =Parent.Width / 4 - 14
                        X: =Parent.Width * 3 / 4 - 2
                        Y: =105
                  - btnHomeReport:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderThickness: =0
                        Fill: =RGBA(20, 83, 45, 1)
                        Height: =69
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(255, 255, 255, 0.15)
                        OnSelect: |-
                          =With({d: Coalesce(gblSelDate, Today()), k: gblEmpID & "_" & Text(Coalesce(gblSelDate, Today()), "yyyymmdd")},
                              With({a: LookUp(CN_勤怠明細台帳, 勤怠キー = k)},
                                  If(IsBlank(a),
                                      Notify("この日の出勤登録がありません。先に出勤登録をしてください", NotificationType.Warning),
                                      Set(gblSelDate, d);
                                      Set(gblReportSite, Coalesce(a.現場名, IfError(Text(ParseJSON(a.原入力).siteName), "")));
                                      Set(gblReportPrime, Coalesce(a.元請会社, IfError(Text(ParseJSON(a.原入力).primeCompany), "")));
                                      Set(gblReportFromCalendar, true); Set(gblReportStart, a.開始日時); Set(gblReportEnd, a.終了日時); Set(gblReportContact, ""); Set(gblReportContent, Coalesce(a.メモ, "")); Navigate(S11_Report, ScreenTransition.None)
                                  )
                              )
                          )
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedFill: =RGBA(255, 255, 255, 0.3)
                        Size: =13
                        Text: ="日報入力"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =840
                  - 請負カレンダー:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 204, 102, 1)
                        BorderThickness: =1
                        Color: =If(gblCalType = "請負", RGBA(10, 10, 10, 1), RGBA(0, 204, 102, 1))
                        Fill: =If(gblCalType = "請負", RGBA(0, 204, 102, 1), RGBA(26, 58, 42, 1))
                        FontWeight: =FontWeight.Bold
                        Height: =47
                        OnSelect: =Set(gblCalType, "請負"); ClearCollect(colAttend, Filter(CN_勤怠明細台帳, 社員レコードキー = gblEmpID, 業種.Value = gblCalType, 開始日時 >= gblMonth, 開始日時 < DateAdd(gblMonth, 1, TimeUnit.Months))); If(gblCalType = "運営", ClearCollect(colOps, Filter(CN_勤怠明細台帳, 開始日時 >= gblMonth, 開始日時 < DateAdd(gblMonth, 1, TimeUnit.Months))))
                        Size: =13
                        Text: ="請負"
                        Width: =Parent.Width / 4 - 14
                        X: =Parent.Width / 2 + 4
                        Y: =105
      - S2_NavBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(26, 58, 42, 1)
            Height: =70
            Width: =Parent.Width
            Y: =Parent.Height - 70
      - S2_Nav1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 204, 102, 0.3)
            OnSelect: =Navigate(S1_Home, ScreenTransition.None)
            PressedFill: =RGBA(0, 204, 102, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: ="ホーム"
            Width: =Parent.Width / 5
            X: =Parent.Width / 5 * 0
            Y: =Parent.Height - 70
      - S2_Nav2:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(0, 204, 102, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 204, 102, 0.3)
            OnSelect: =Navigate(S2_Calendar, ScreenTransition.None)
            PressedFill: =RGBA(0, 204, 102, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: ="カレンダー"
            Width: =Parent.Width / 5
            X: =Parent.Width / 5 * 1
            Y: =Parent.Height - 70
      - S2_Nav3:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 204, 102, 0.3)
            OnSelect: =Set(gblSelDate, Today()); Navigate(S3_Register, ScreenTransition.None)
            PressedFill: =RGBA(0, 204, 102, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: ="登録"
            Width: =Parent.Width / 5
            X: =Parent.Width / 5 * 2
            Y: =Parent.Height - 70
      - S2_Nav4:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 204, 102, 0.3)
            OnSelect: '=Navigate(S4_Summary, ScreenTransition.None) '
            PressedFill: =RGBA(0, 204, 102, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: ="集計"
            Width: =Parent.Width / 5
            X: =Parent.Width / 5 * 3
            Y: =Parent.Height - 70
      - S2_Nav5:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 204, 102, 0.3)
            OnSelect: '=Navigate(S7_Settings, ScreenTransition.None)    '
            PressedFill: =RGBA(0, 204, 102, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: ="設定"
            Width: =Parent.Width / 5
            X: =Parent.Width / 5 * 4
            Y: =Parent.Height - 70
      - S2_PlanAttach:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0,255,102,1)
            BorderThickness: =1
            Color: =RGBA(0,255,102,1)
            Fill: =RGBA(8,34,20,1)
            FontWeight: =FontWeight.Bold
            Height: =44
            OnSelect: =Navigate(Screen2, ScreenTransition.None)
            Size: =14
            Text: ="計画実施表を添付"
            Visible: =gblCalType = "設備"
            Width: =Parent.Width - 32
            X: =16
            Y: =Parent.Height - 122
