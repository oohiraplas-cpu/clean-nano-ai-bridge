            Text: ="人々"
            Width: =Parent.Width - Self.X * 2
            Wrap: =false
            X: =32
      - TextSearchBox1:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 0, 0, 1)
            BorderThickness: =1
            Color: =RGBA(70, 68, 64, 1)
            Default: =""
            DisabledBorderColor: =ColorFade(Self.BorderColor, 40%)
            DisabledColor: =ColorFade(Self.Color, 40%)
            DisabledFill: =Self.Fill
            FocusedBorderThickness: =3
            Font: =Font.'Open Sans'
            HintText: ="検索"
            HoverBorderColor: =Self.Color
            HoverColor: =Self.Color
            HoverFill: =Self.Fill
            PaddingLeft: =70
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =14
            Width: =Parent.Width
            Y: =RectQuickActionBar1.Height
      - SearchIcon2:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Color: =RGBA(0, 120, 212, 1)
            DisabledBorderColor: =RGBA(245, 245, 245, 1)
            DisabledColor: =RGBA(225, 223, 221, 1)
            DisabledFill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =4
            Height: =Self.Width
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(16, 110, 190, 1)
            HoverFill: =RGBA(0, 0, 0, 0)
            Icon: =Icon.Search
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(16, 110, 190, 1)
            PressedFill: =RGBA(0, 0, 0, 0)
            Tooltip: ="検索"
            Width: =TextSearchBox1.Height
            X: =24
            Y: =TextSearchBox1.Y
      - RectSeparator1:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 120, 212, 1)
            Height: =1
            Width: =Parent.Width
            Y: =TextSearchBox1.Y + TextSearchBox1.Height
      - iconEmptyState1:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Color: =RGBA(0, 120, 212, 1)
            DisabledBorderColor: =RGBA(245, 245, 245, 1)
            DisabledColor: =RGBA(225, 223, 221, 1)
            DisabledFill: =RGBA(0, 0, 0, 0)
            DisplayMode: =DisplayMode.View
            FocusedBorderThickness: =4
            Height: =55
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(16, 110, 190, 1)
            HoverFill: =RGBA(0, 0, 0, 0)
            Icon: =Icon.Person
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(16, 110, 190, 1)
            PressedFill: =RGBA(0, 0, 0, 0)
            Visible: =IsEmpty(MyPeople)
            Width: =55
            X: =Parent.Width / 2 - Self.Width/2
            Y: =Parent.Height / 2 - Self.Height / 2 - 100
      - LblEmptyState1:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(50, 49, 48, 1)
            DisabledColor: =RGBA(161, 159, 157, 1)
            Font: =Font.'Segoe UI'
            Height: =50
            Size: =19
            Text: ="組織内のユーザーを検索"
            Visible: =IsEmpty(MyPeople)
            Width: =535
            Wrap: =false
            X: =Parent.Width / 2 - Self.Width/2
            Y: =iconEmptyState1.Y + iconEmptyState1.Height + 20
      - UserBrowseGallery1:
          Control: Gallery@2.15.0
          Variant: PeoplePickerTabletGallery
          Properties:
            BorderColor: =RGBA(245, 245, 245, 1)
            Fill: =Parent.Fill
            Height: =Parent.Height - Self.Y
            Items: |-
              =If(!IsBlank(Trim(TextSearchBox1.Text)), 'Office365ユーザー'.SearchUser({searchTerm: Trim(TextSearchBox1.Text), top: 15}))
            TemplatePadding: =0
            TemplateSize: =87
            Visible: =!IsBlank(Trim(TextSearchBox1.Text))
            Width: =Parent.Width
            X: =0
            Y: =TextSearchBox1.Y + TextSearchBox1.Height
          Children:
            - Rectangle3:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =Title3.Color
                  BorderThickness: =If(ThisItem.UserPrincipalName in MyPeople.UserPrincipalName, 2, 0)
                  DisabledFill: =RGBA(161, 159, 157, 1)
                  Fill: =RGBA(0,0,0,0)
                  Height: =Parent.TemplateHeight - 2*Self.Y
                  HoverFill: =RGBA(0,0,0,0)
                  OnSelect: =Select(Title3)
                  PressedFill: =RGBA(0, 120, 212, 1)
                  Width: =Parent.TemplateWidth - 2*Self.X
                  X: =1
                  Y: =1
            - iconUser1:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(225, 223, 221, 1)
                  Fill: =RectQuickActionBar1.Fill
                  Height: =ProfileImage1.Height
                  Icon: =Icon.Person
                  OnSelect: =Select(Title3)
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =12
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Width: =ProfileImage1.Width
                  X: =ProfileImage1.X
                  Y: =ProfileImage1.Y
            - ProfileImage1:
                Control: Image@2.2.3
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =2
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  Height: =Self.Width
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverFill: =RGBA(0, 0, 0, 0)
                  Image: =If(!IsBlank(ThisItem.Id), 'Office365ユーザー'.UserPhotoV2(ThisItem.Id))
                  OnSelect: =Select(Title3)
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Width: =UserBrowseGallery1.TemplateHeight - 30
                  X: =37
                  Y: =(UserBrowseGallery1.TemplateHeight / 2) - (Self.Height/2)
            - Title3:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =Self.Color
                  Color: =RGBA(50, 49, 48, 1)
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =Self.Size * 1.8
                  OnSelect: |-
                    =/*Select user, clear search contents and if this user hasn't been added to MyPeople collection, add them*/
                    Concurrent(
                    Set(_selectedUser, ThisItem),
                    Reset(TextSearchBox1),
                    If(Not(ThisItem.UserPrincipalName in MyPeople.UserPrincipalName), Collect(MyPeople, ThisItem)))
                  Size: =12
                  TabIndex: =0
                  Text: =ThisItem.DisplayName
                  Width: =UserBrowseGallery1.TemplateWidth - 232
                  Wrap: =false
                  X: =ProfileImage1.X + ProfileImage1.Width + 16
                  Y: =16
            - Subtitle2:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(50, 49, 48, 1)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Title3)
                  Size: =12
                  Text: =ThisItem.UserPrincipalName
                  Width: =Title3.Width
                  Wrap: =false
                  X: =Title3.X
                  Y: =UserBrowseGallery1.TemplateHeight - Self.Height - 20
            - Separator3:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(0, 120, 212, 1)
                  Height: =1
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - 1
