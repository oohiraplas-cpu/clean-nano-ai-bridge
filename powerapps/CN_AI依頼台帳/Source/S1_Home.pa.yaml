Screens:
  S1_Home:
    Properties:
      Fill: =RGBA(10, 10, 10, 1)
      OnVisible: |-
        =If(IsBlank(gblMonth), Set(gblMonth, Date(Year(Today()), Month(Today()), 1)));
        If(IsBlank(gblEmpID), Set(gblEmpID, First(CN_社員台帳).EmployeeID));
        ClearCollect(colAttend, Filter(CN_勤怠明細台帳, EmployeeRecordKey = gblEmpID, StartAt >= gblMonth, StartAt < DateAdd(gblMonth, 1, TimeUnit.Months)));
        If(IsBlank(gblIsAdmin), Set(gblIsAdmin, Or(User().Email = "k.k.hisyoengineer@hisyoengineer.onmicrosoft.com")))
    Children:
      - Home_Title:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(0, 204, 102, 1)
            FontWeight: =FontWeight.Bold
            Height: =50
            Size: =22
            Text: ="clean nano"
            Width: =Parent.Width - 32
            X: =16
            Y: =16
      - Home_EmpLabel:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(120, 120, 120, 1)
            Height: =28
            Size: =12
            Text: ="作業員"
            Width: =Parent.Width - 32
            X: =16
            Y: =76
            Visible: =false
      - Home_EmpDrop:
          Control: Classic/DropDown@2.3.1
          Properties:
            BorderColor: =RGBA(0, 204, 102, 1)
            ChevronBackground: =RGBA(0, 204, 102, 1)
            ChevronFill: =RGBA(10, 10, 10, 1)
            Color: =RGBA(255, 255, 255, 1)
            Default: =LookUp(CN_社員台帳, EmployeeID = gblEmpID).Title
            Fill: =RGBA(26, 58, 42, 1)
            Height: =48
            Items: =Sort(CN_社員台帳, Title).Title
            Items.Value: =Title
            OnChange: |-
              =Set(gblEmpID, LookUp(CN_社員台帳, Title = Self.Selected.Title).EmployeeID);
              ClearCollect(colAttend, Filter(CN_勤怠明細台帳, EmployeeRecordKey = gblEmpID, StartAt >= gblMonth, StartAt < DateAdd(gblMonth, 1, TimeUnit.Months)))
            SelectionFill: =RGBA(0, 204, 102, 1)
            Size: =14
            Width: =Parent.Width - 32
            X: =16
            Y: =106
            Visible: =false
      - Home_MonthLabel:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =32
            Size: =14
            Text: =Text(gblMonth, "yyyy年m月") & " の実績"
            Width: =Parent.Width - 32
            X: =16
            Y: =174
      - Home_CardDays:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(26, 58, 42, 1)
            Height: =130
            Width: =Parent.Width - 32
            X: =16
            Y: =214
      - Home_DaysLabel:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =30
            Size: =11
            Text: ="今月の出勤日数"
            Width: =Parent.Width - 64
            X: =32
            Y: =224
      - Home_DaysValue:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(0, 204, 102, 1)
            FontWeight: =FontWeight.Bold
            Height: =72
            Size: =36
            Text: =CountRows(Distinct(colAttend, Text(StartAt, "yyyymmdd"))) & " 日"
            Width: =Parent.Width - 64
            X: =32
            Y: =258
      - Home_CardAllowance:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(26, 58, 42, 1)
            Height: =130
            Width: =Parent.Width - 32
            X: =16
            Y: =360
      - Home_AllowanceLabel:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =30
            Size: =11
            Text: ="今月の手当合計（見込み）"
            Width: =Parent.Width - 64
            X: =32
            Y: =370
      - Home_AllowanceValue:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(0, 204, 102, 1)
            FontWeight: =FontWeight.Bold
            Height: =72
            Size: =If(Self.Text = "社員マスタ未登録", 18, 30)
            Text: |-
              =With({m: LookUp(CN_社員マスタ, 社員ID = gblEmpID)},
                  If(IsBlank(m), "社員マスタ未登録",
                      Text(
                          CountRows(Filter(colAttend, WorkStatus.Value = "日勤")) * Coalesce(m.日勤手当, 0)
                          + CountRows(Filter(colAttend, WorkStatus.Value = "夜勤")) * Coalesce(m.夜勤手当, 0)
                          + CountRows(Filter(colAttend, WorkStatus.Value = "早出")) * Coalesce(m.早出手当, 0),
                          "¥#,##0")))
            Width: =Parent.Width - 64
            X: =32
            Y: =404
      - Home_BtnCalendar:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(10, 10, 10, 1)
            Fill: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =56
            HoverFill: =RGBA(245, 245, 245, 1)
            OnSelect: =Set(gblTimeTreeOpen, !Coalesce(gblTimeTreeOpen, false))
            PressedFill: =RGBA(224, 224, 224, 1)
            Size: =16
            Text: ="Time tree"
            Width: =Parent.Width - 32
            X: =16
            Y: =510
      - Home_TimeTreeDemolition:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =1
            BorderColor: =RGBA(80, 200, 110, 1)
            Color: =RGBA(160, 255, 185, 1)
            Fill: =RGBA(12, 35, 23, 1)
            FontWeight: =FontWeight.Bold
            Height: =52
            OnSelect: =Set(gblCalType, "解体"); Set(gblTimeTreeOpen, false); Navigate(S2_Calendar, ScreenTransition.None)
            Size: =11
            Text: ="⚔ 解体"
            Visible: =Coalesce(gblTimeTreeOpen, false)
            Width: =(Parent.Width - 40) / 3
            X: =16 + 0 * ((Parent.Width - 40) / 3 + 4)
            Y: =568
      - Home_TimeTreeEquipment:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =1
            BorderColor: =RGBA(80, 200, 110, 1)
            Color: =RGBA(160, 255, 185, 1)
            Fill: =RGBA(12, 35, 23, 1)
            FontWeight: =FontWeight.Bold
            Height: =52
            OnSelect: =Set(gblCalType, "設備"); Set(gblTimeTreeOpen, false); Navigate(S2_Calendar, ScreenTransition.None)
            Size: =11
            Text: ="⚙ 設備"
            Visible: =Coalesce(gblTimeTreeOpen, false)
            Width: =(Parent.Width - 40) / 3
            X: =16 + 1 * ((Parent.Width - 40) / 3 + 4)
            Y: =568
      - Home_TimeTreeOperations:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =1
            BorderColor: =RGBA(80, 200, 110, 1)
            Color: =RGBA(160, 255, 185, 1)
            Fill: =RGBA(12, 35, 23, 1)
            FontWeight: =FontWeight.Bold
            Height: =52
            OnSelect: =Set(gblCalType, "運営"); Set(gblTimeTreeOpen, false); Navigate(S2_Calendar, ScreenTransition.None)
            Size: =11
            Text: ="運営・経理"
            Visible: =Coalesce(gblTimeTreeOpen, false) && gblIsAdmin
            Width: =(Parent.Width - 40) / 3
            X: =16 + 2 * ((Parent.Width - 40) / 3 + 4)
            Y: =568
      - Home_BtnEquipment:
          Control: Classic/Button@2.2.0
          Properties:
            Visible: =!Coalesce(gblTimeTreeOpen, false)
            BorderThickness: =0
            Color: =RGBA(10, 10, 10, 1)
            Fill: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =56
            HoverFill: =RGBA(245, 245, 245, 1)
            OnSelect: =Navigate(S12_EquipmentOCR, ScreenTransition.None)
            PressedFill: =RGBA(224, 224, 224, 1)
            Size: =15
            Text: ="設備書類自動記載"
            Width: =Parent.Width - 32
            X: =16
            Y: =578
      - Home_BtnAdmin:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(10, 10, 10, 1)
            Fill: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =48
            HoverColor: =RGBA(10, 10, 10, 1)
            HoverFill: =RGBA(245, 245, 245, 1)
            OnSelect: =If(gblIsAdmin, Navigate(S6_Members, ScreenTransition.None), Notify("運営管理は管理者専用です", NotificationType.Warning))
            PressedFill: =RGBA(224, 224, 224, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =12
            Text: ="運営管理"
            Visible: =gblIsAdmin
            Width: =120
            X: =Parent.Width - 136
            Y: =Parent.Height - 64
      - Home_NavBar:
          Control: Rectangle@2.3.0
          Properties:
            Visible: =false
            Fill: =RGBA(26, 58, 42, 1)
            Height: =70
            Width: =Parent.Width
            Y: =Parent.Height - 70
      - Home_NavHome:
          Control: Classic/Button@2.2.0
          Properties:
            Visible: =false
            BorderThickness: =0
            Color: =RGBA(10, 10, 10, 1)
            Fill: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(10, 10, 10, 1)
            HoverFill: =RGBA(245, 245, 245, 1)
            OnSelect: =Navigate(S1_Home, ScreenTransition.None)
            PressedFill: =RGBA(224, 224, 224, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: ="ホーム"
            Width: =Parent.Width / 5
            X: =Parent.Width / 5 * 0
            Y: =Parent.Height - 70
      - Home_NavCalendar:
          Control: Classic/Button@2.2.0
          Properties:
            Visible: =false
            BorderThickness: =0
            Color: =RGBA(10, 10, 10, 1)
            Fill: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(10, 10, 10, 1)
            HoverFill: =RGBA(245, 245, 245, 1)
            OnSelect: =Navigate(S2_Calendar, ScreenTransition.None)
            PressedFill: =RGBA(224, 224, 224, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: ="カレンダー"
            Width: =Parent.Width / 5
            X: =Parent.Width / 5 * 1
            Y: =Parent.Height - 70
      - Home_NavRegister:
          Control: Classic/Button@2.2.0
          Properties:
            Visible: =false
            BorderThickness: =0
            Color: =RGBA(10, 10, 10, 1)
            Fill: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(10, 10, 10, 1)
            HoverFill: =RGBA(245, 245, 245, 1)
            OnSelect: =Set(gblSelDate, Today()); Navigate(S3_Register, ScreenTransition.None)
            PressedFill: =RGBA(224, 224, 224, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: ="登録"
            Width: =Parent.Width / 5
            X: =Parent.Width / 5 * 2
            Y: =Parent.Height - 70
      - Home_NavSummary:
          Control: Classic/Button@2.2.0
          Properties:
            Visible: =false
            BorderThickness: =0
            Color: =RGBA(10, 10, 10, 1)
            Fill: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(10, 10, 10, 1)
            HoverFill: =RGBA(245, 245, 245, 1)
            OnSelect: '=Navigate(S4_Summary, ScreenTransition.None) '
            PressedFill: =RGBA(224, 224, 224, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: ="集計"
            Width: =Parent.Width / 5
            X: =Parent.Width / 5 * 3
            Y: =Parent.Height - 70
      - Home_BtnSettings:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(10, 10, 10, 1)
            Fill: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =40
            HoverColor: =RGBA(10, 10, 10, 1)
            HoverFill: =RGBA(245, 245, 245, 1)
            OnSelect: '=Navigate(S7_Settings, ScreenTransition.None)    '
            PressedFill: =RGBA(224, 224, 224, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =12
            Text: ="設定"
            Width: =80
            X: =Parent.Width - 96
            Y: =16
      - Home_Unused:
          Control: Classic/Button@2.2.0
          Properties:
            Visible: =false
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Color: =RGBA(10, 10, 10, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Segoe UI'
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(10, 10, 10, 1)
            HoverFill: =RGBA(245, 245, 245, 1)
            PressedBorderColor: =RGBA(0, 69, 120, 1)
            PressedColor: =RGBA(10, 10, 10, 1)
            PressedFill: =RGBA(224, 224, 224, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            X: =40
            Y: =40
