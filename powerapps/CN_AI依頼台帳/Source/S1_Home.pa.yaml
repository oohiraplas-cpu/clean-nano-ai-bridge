Screens:
  S1_Home:
    Properties:
      Fill: =RGBA(6, 18, 10, 1)
      OnVisible: |-
        =If(IsBlank(gblMonth), Set(gblMonth, Date(Year(Today()), Month(Today()), 1)));
        IfError(
          If(IsBlank(gblEmpID), Set(gblEmpID, First(CN_社員台帳).EmployeeID));
          ClearCollect(colAttend, Filter(CN_勤怠明細台帳, EmployeeRecordKey = gblEmpID, StartAt >= gblMonth, StartAt < DateAdd(gblMonth, 1, TimeUnit.Months)));
          ClearCollect(colHomeNews,
            {SortKey: 1, Line: "最近の予定・進行状況"},
            {SortKey: 2, Line: "本日 " & Text(Today(), "yyyy/mm/dd") & " ｜ " & User().FullName},
            {SortKey: 3, Line: "申請・日報・カレンダーの最新状況を確認してください"}
          ),
          Clear(colAttend);
          ClearCollect(colHomeNews,{SortKey:1,Line:"最新情報を取得できません。メニュー操作は継続できます。"});
          Notify("データ接続を確認してください。画面操作は継続できます。", NotificationType.Warning)
        )
    Children:
      - S1_Header:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(8, 34, 20, 1)
            Height: =92
            Width: =Parent.Width
            X: =0
            Y: =0
      - S1_Title:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(0, 255, 102, 1)
            FontWeight: =FontWeight.Bold
            Height: =44
            Size: =24
            Text: ="CLEAN NANO"
            Width: =Parent.Width - 32
            X: =16
            Y: =10
      - S1_User:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(210, 255, 226, 1)
            Height: =30
            Size: =11
            Text: =Text(Now(), "yyyy/mm/dd HH:mm") & "  ｜  " & User().FullName
            Width: =Parent.Width - 32
            X: =16
            Y: =52
      - S1_TickerFrame:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 255, 102, 1)
            BorderThickness: =1
            Fill: =RGBA(0, 24, 12, 1)
            Height: =74
            Width: =Parent.Width - 32
            X: =16
            Y: =104
      - S1_TickerTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(0, 255, 102, 1)
            FontWeight: =FontWeight.Bold
            Height: =26
            Size: =12
            Text: ="▶ 最近の予定・進行状況"
            Width: =Parent.Width - 56
            X: =28
            Y: =112
      - S1_Ticker:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(220, 255, 230, 1)
            Height: =32
            Size: =11
            Text: =Concat(SortByColumns(colHomeNews, "SortKey"), Line & "   ◆   ")
            Width: =Parent.Width - 56
            X: =28
            Y: =140
      - S1_MenuTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =30
            Size: =14
            Text: ="業務メニュー"
            Width: =Parent.Width - 32
