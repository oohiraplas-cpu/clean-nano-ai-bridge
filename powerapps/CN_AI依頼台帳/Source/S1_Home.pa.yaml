Screens:
  S1_Home:
    Properties:
      Fill: =RGBA(8, 8, 9, 1)
      OnVisible: |-
        =If(IsBlank(gblMonth), Set(gblMonth, Date(Year(Today()), Month(Today()), 1)));
        Set(gblEmpID, Blank());
        Set(gblIdentityVerified, false);
        Clear(colAttend); Clear(colOps); Set(gblOpsAuthorized, false);
        Set(gblCurrentEmployee, If(!IsBlank(User().EntraObjectId), LookUp(CN_社員台帳, EntraObjectId = Text(User().EntraObjectId)), Blank()));
        If(!IsBlank(Trim(Coalesce(gblCurrentEmployee.EmployeeID, ""))) && !IsBlank(User().EntraObjectId) && Lower(Trim(Coalesce(gblCurrentEmployee.EntraObjectId, ""))) = Lower(Text(User().EntraObjectId)), Set(gblEmpID, Trim(gblCurrentEmployee.EmployeeID)); Set(gblIdentityVerified, true));
        If(gblIdentityVerified && !IsBlank(gblEmpID) && !IsBlank(User().EntraObjectId) && (Trim(Coalesce(gblCurrentEmployee.EmployeeID, "")) = gblEmpID && Lower(Trim(Coalesce(gblCurrentEmployee.EntraObjectId, ""))) = Lower(Text(User().EntraObjectId))), ClearCollect(colAttend, Filter(CN_勤怠明細台帳, EmployeeRecordKey = gblEmpID, StartAt >= gblMonth, StartAt < DateAdd(gblMonth, 1, TimeUnit.Months))), Set(gblEmpID, Blank()); Set(gblIdentityVerified, false); Set(gblCurrentEmployee, Blank()); Clear(colAttend); Clear(colOps); Set(gblOpsAuthorized, false); Notify("本人確認が完了していません。管理者に連絡してください。", NotificationType.Error))
    Children:
      - S1_Title:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(160, 255, 190, 1)
            FontWeight: =FontWeight.Bold
            Height: =46
            Size: =22
            Text: ="CLEAN NANO"
            Width: =Parent.Width - 32
            X: =16
            Y: =12
      - S1_Subtitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(190, 190, 196, 1)
            Height: =24
            Size: =11
            Text: ="現場を、もっとスマートに"
            Width: =Parent.Width - 32
            X: =16
            Y: =54
      - S1_VisualCard:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(133, 70, 168, 1)
            BorderThickness: =1
            Color: =RGBA(245, 245, 248, 1)
            Fill: =RGBA(18, 54, 33, 1)
            FontWeight: =FontWeight.Bold
            Height: =112
            HoverFill: =RGBA(27, 76, 46, 1)
            OnSelect: =Navigate(S2_Calendar, ScreenTransition.None)
            PressedFill: =RGBA(12, 42, 25, 1)
            Size: =18
            Text: ="▦  設備カレンダー" & Char(10) & "今日の設備予定・車両情報を開く  →"
            Width: =Parent.Width - 32
            X: =16
            Y: =140
      - S1_Scan:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(126, 65, 160, 1)
            BorderThickness: =1
            Color: =RGBA(245,245,248,1)
            Fill: =RGBA(22, 66, 39, 1)
            FontWeight: =FontWeight.Bold
            Height: =68
            OnSelect: =Notify("書類スキャン：OCR接続確認後に読み取りを開始します。原本は変更しません。", NotificationType.Information)
            Size: =15
            Text: ="書類スキャン" & Char(10) & "撮影・OCR"
            Width: =(Parent.Width - 40) / 2
            X: =16
            Y: =266
      - S1_Report:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(126, 65, 160, 1)
            BorderThickness: =1
            Color: =RGBA(245,245,248,1)
            Fill: =RGBA(22, 66, 39, 1)
            FontWeight: =FontWeight.Bold
            Height: =68
            OnSelect: =Set(gblReportFromCalendar, false); Navigate(S11_Report, ScreenTransition.None)
            Size: =15
            Text: ="作業日報" & Char(10) & "入力・PDF確認"
            Width: =(Parent.Width - 40) / 2
            X: =24 + (Parent.Width - 40) / 2
            Y: =266
      - S1_Register:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(126, 65, 160, 1)
            BorderThickness: =1
            Color: =RGBA(245,245,248,1)
            Fill: =RGBA(22, 66, 39, 1)
            FontWeight: =FontWeight.Bold
            Height: =68
            OnSelect: =Navigate(S3_Register, ScreenTransition.None)
            Size: =15
            Text: ="申請・登録" & Char(10) & "各種申請"
            Width: =(Parent.Width - 40) / 2
            X: =16
            Y: =346
      - S1_MyData:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(126, 65, 160, 1)
            BorderThickness: =1
            Color: =RGBA(245,245,248,1)
            Fill: =RGBA(22, 66, 39, 1)
            FontWeight: =FontWeight.Bold
            Height: =68
            OnSelect: =Navigate(S8_UserOnboarding, ScreenTransition.None)
            Size: =15
            Text: ="マイデータ" & Char(10) & "社員情報"
            Width: =(Parent.Width - 40) / 2
            X: =24 + (Parent.Width - 40) / 2
            Y: =346
      - S1_Summary:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(126, 65, 160, 1)
            BorderThickness: =1
            Color: =RGBA(245,245,248,1)
            Fill: =RGBA(18, 48, 31, 1)
            FontWeight: =FontWeight.Bold
            Height: =58
            OnSelect: =Navigate(S4_Summary, ScreenTransition.None)
            Size: =13
            Text: ="実績・給与"
            Width: =(Parent.Width - 40) / 2
            X: =16
            Y: =426
      - S1_Settings:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(126, 65, 160, 1)
            BorderThickness: =1
            Color: =RGBA(245,245,248,1)
            Fill: =RGBA(18, 48, 31, 1)
            FontWeight: =FontWeight.Bold
            Height: =58
            OnSelect: =Navigate(S7_Settings, ScreenTransition.None)
            Size: =13
            Text: ="メンバー・設定"
            Width: =(Parent.Width - 40) / 2
            X: =24 + (Parent.Width - 40) / 2
            Y: =426
      - S1_InvoiceEntry:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(126, 65, 160, 1)
            BorderThickness: =1
            Color: =RGBA(190, 190, 195, 1)
            Fill: =RGBA(18, 48, 31, 1)
            FontWeight: =FontWeight.Bold
            Height: =48
            DisplayMode: =DisplayMode.Disabled
            Text: ="請求書自動作成（連携確認待ち）"
            Width: =Parent.Width - 32
            X: =16
            Y: =604
      - S1_StatusCard:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(110, 58, 142, 1)
            BorderThickness: =1
            Fill: =RGBA(14, 20, 17, 1)
            Height: =92
            Width: =Parent.Width - 32
            X: =16
            Y: =500
      - S1_Status:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(235,235,240,1)
            Height: =72
            Size: =13
            Text: ="今月の実績" & Char(10) & "出勤 " & CountRows(Distinct(colAttend, Text(StartAt, "yyyymmdd"))) & "日  ｜  " & Text(gblMonth, "yyyy年m月")
            Width: =Parent.Width - 64
            X: =32
            Y: =510
