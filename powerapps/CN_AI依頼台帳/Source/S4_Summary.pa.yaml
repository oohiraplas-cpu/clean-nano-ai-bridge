Screens:
  S4_Summary:
    Properties:
      Fill: =RGBA(10, 10, 10, 1)
      OnVisible: |-
        =If(IsBlank(gblMonth), Set(gblMonth, Date(Year(Today()), Month(Today()), 1)));
        If(IsBlank(gblEmpID), Set(gblEmpID, First(CN_社員台帳).EmployeeID));
        ClearCollect(colAttend, Filter(CN_勤怠明細台帳, 社員レコードキー = gblEmpID, 開始日時 >= gblMonth, 開始日時 < DateAdd(gblMonth, 1, TimeUnit.Months)))
    Children:
      - S4_Title:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(0, 204, 102, 1)
            FontWeight: =FontWeight.Bold
            Height: =50
            Size: =20
            Text: =Text(gblMonth, "yyyy年m月")
            Width: =Parent.Width - 140
            X: =70
            Y: =16
      - S4_Prev:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(0, 204, 102, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =50
            HoverFill: =RGBA(0, 230, 115, 1)
            OnSelect: =Set(gblMonth, DateAdd(gblMonth, -1, TimeUnit.Months)); ClearCollect(colAttend, Filter(CN_勤怠明細台帳, 社員レコードキー = gblEmpID, 開始日時 >= gblMonth, 開始日時 < DateAdd(gblMonth, 1, TimeUnit.Months)))
            PressedFill: =RGBA(0, 160, 80, 1)
            Size: =18
            Text: ="＜"
            Width: =50
            X: =16
            Y: =16
      - S4_Next:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(0, 204, 102, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =50
            HoverFill: =RGBA(0, 230, 115, 1)
            OnSelect: =Set(gblMonth, DateAdd(gblMonth, 1, TimeUnit.Months)); ClearCollect(colAttend, Filter(CN_勤怠明細台帳, 社員レコードキー = gblEmpID, 開始日時 >= gblMonth, 開始日時 < DateAdd(gblMonth, 1, TimeUnit.Months)))
            PressedFill: =RGBA(0, 160, 80, 1)
            Size: =18
            Text: ="＞"
            Width: =50
            X: =Parent.Width - 66
            Y: =16
      - S4_Emp:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(120, 120, 120, 1)
            Height: =26
            Size: =12
            Text: ="作業員：" & Coalesce(LookUp(CN_社員台帳, EmployeeID = gblEmpID).Title, "未選択")
            Width: =Parent.Width - 32
            X: =16
            Y: =68
      - S4_Card:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(26, 58, 42, 1)
            Height: =150
            Width: =Parent.Width - 32
            X: =16
            Y: =100
      - S4_Days:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(0, 204, 102, 1)
            FontWeight: =FontWeight.Bold
            Height: =36
            Size: =18
            Text: ="出勤日数　" & CountRows(Distinct(colAttend, Text(開始日時, "yyyymmdd"))) & " 日"
            Width: =Parent.Width - 64
            X: =32
            Y: =108
      - S4_Hours:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =30
            Size: =14
            Text: |-
              ="総勤務時間　" & With({t: Sum(colAttend, DateDiff(開始日時, 終了日時, TimeUnit.Minutes) - Coalesce(休憩分, 0))}, RoundDown(t / 60, 0) & "時間" & Mod(t, 60) & "分")
            Width: =Parent.Width - 64
            X: =32
            Y: =144
      - S4_ByStatus:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =60
            Text: ="日勤 " & CountRows(Filter(colAttend, 勤務区分.Value = "日勤")) & "日　夜勤 " & CountRows(Filter(colAttend, 勤務区分.Value = "夜勤")) & "日　早出 " & CountRows(Filter(colAttend, 勤務区分.Value = "早出")) & "日　残業 " & CountRows(Filter(colAttend, 勤務区分.Value = "残業")) & "日"
            Width: =Parent.Width - 64
            X: =32
            Y: =178
      - S4_ListCap:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(120, 120, 120, 1)
            Height: =24
            Size: =11
            Text: ="明細"
            Width: =Parent.Width - 32
            X: =16
            Y: =258
      - S4_List:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Height: =Parent.Height - 284 - 70 - 70
            Items: =Sort(colAttend, 開始日時)
            TemplatePadding: =2
            TemplateSize: =52
            Width: =Parent.Width - 32
            X: =16
            Y: '=284 '
          Children:
            - S4_Row:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(26, 58, 42, 1)
                  Height: =Parent.TemplateHeight
                  Width: =Parent.TemplateWidth
            - S4_RowDate:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(255, 255, 255, 1)
                  FontWeight: =FontWeight.Bold
                  Height: =Parent.TemplateHeight
                  Size: =12
                  Text: =Text(ThisItem.開始日時, "m/d") & "（" & Left(Text(ThisItem.開始日時, "dddd"), 1) & "）"
                  Width: =90
                  X: =8
            - S4_RowStatus:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =RGBA(10, 10, 10, 1)
                  Fill: =RGBA(0, 204, 102, 1)
                  Height: =26
                  Size: =11
                  Text: =ThisItem.勤務区分.Value
                  Width: =50
                  X: =98
                  Y: =12
            - S4_RowInfo:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(255, 255, 255, 1)
                  Height: =Parent.TemplateHeight
                  Size: =11
                  Text: =Text(ThisItem.開始日時, "hh:mm") & "-" & Text(ThisItem.終了日時, "hh:mm") & "　" & Coalesce(LookUp(CN_現場台帳, SiteID = ThisItem.現場ID).Title, ThisItem.現場ID)
                  Width: =Parent.TemplateWidth - 164
                  X: =156
      - S4_GoSalary:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(10, 10, 10, 1)
            Fill: =RGBA(0, 204, 102, 1)
            FontWeight: =FontWeight.Bold
            Height: =52
            HoverFill: =RGBA(0, 230, 115, 1)
            OnSelect: =Navigate(S5_Salary, ScreenTransition.None)
            PressedFill: =RGBA(0, 160, 80, 1)
            Text: ="給与見込みを見る"
            Width: =Parent.Width - 32
            X: =16
            Y: =Parent.Height - 70 - 62
      - S4_NavBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(26, 58, 42, 1)
            Height: =70
            Width: =Parent.Width
            Y: =Parent.Height - 70
      - S4_Nav1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 204, 102, 0.3)
            OnSelect: =Navigate(S1_Home, ScreenTransition.None)
            PressedFill: =RGBA(0, 204, 102, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: ="ホーム"
            Width: =Parent.Width / 5
            X: =Parent.Width / 5 * 0
            Y: =Parent.Height - 70
      - S4_Nav2:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 204, 102, 0.3)
            OnSelect: =Navigate(S2_Calendar, ScreenTransition.None)
            PressedFill: =RGBA(0, 204, 102, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: ="カレンダー"
            Width: =Parent.Width / 5
            X: =Parent.Width / 5 * 1
            Y: =Parent.Height - 70
      - S4_Nav3:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 204, 102, 0.3)
            OnSelect: =Set(gblSelDate, Today()); Navigate(S3_Register, ScreenTransition.None)
            PressedFill: =RGBA(0, 204, 102, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: ="登録"
            Width: =Parent.Width / 5
            X: =Parent.Width / 5 * 2
            Y: =Parent.Height - 70
      - S4_Nav4:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(0, 204, 102, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 204, 102, 0.3)
            OnSelect: =Navigate(S4_Summary, ScreenTransition.None)
            PressedFill: =RGBA(0, 204, 102, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: ="集計"
            Width: =Parent.Width / 5
            X: =Parent.Width / 5 * 3
            Y: =Parent.Height - 70
      - S4_Nav5:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(26, 58, 42, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 204, 102, 0.3)
            OnSelect: '=Navigate(S7_Settings, ScreenTransition.None)    '
            PressedFill: =RGBA(0, 204, 102, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =11
            Text: ="設定"
            Width: =Parent.Width / 5
            X: =Parent.Width / 5 * 4
            Y: =Parent.Height - 70
