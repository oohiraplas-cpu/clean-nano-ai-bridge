Screens:
  S15_OCR:
    Properties:
      Fill: =RGBA(6,18,10,1)
    Children:
      - S15_Back:
          Control: Classic/Button@2.2.0
          Properties:
            OnSelect: =Navigate(S2_Calendar, ScreenTransition.None)
            Text: ="← 設備カレンダー"
            X: =16
            Y: =16
      - S15_Title:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(0,255,102,1)
            FontWeight: =FontWeight.Bold
            Size: =22
            Text: ="計画実施表 / OCR自動記載"
            X: =16
            Y: =80
            Width: =Parent.Width-32
      - S15_Info:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(220,255,230,1)
            Height: =110
            Text: ="検満リスト → 自動検索 → 番号分割 → 住所改行 → 照合 → 計画実施表雛形へ転記 → PDF出力。不一致時は処理を停止します。元の検満リストは変更しません。"
            Width: =Parent.Width-32
            X: =16
            Y: =140
